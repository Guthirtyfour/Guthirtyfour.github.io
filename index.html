<p><strong>呼吸系统</strong></p>
<p>1. 组成</p>
<ul><li>肺外呼吸道：鼻、咽、喉、气管、主支气管</li></ul>
<ul><li>肺：肺内支气管树 + 肺泡（气体交换场所）</li></ul>
<ul><li>临床分类：</li></ul>
<ul><li>上呼吸道：鼻、咽、喉</li></ul>
<ul><li>下呼吸道：气管及各级支气管</li></ul>
<p>2. 功能</p>
<ul><li>主要功能：气体交换（吸入O₂，呼出CO₂）</li></ul>
<ul><li>辅助功能：嗅觉（鼻）、发音（喉）、加温、湿润、防御。</li></ul>
<hr>
<h3>二、肺外呼吸道结构详解</h3>
<p>1. 鼻</p>
<p>（1）外鼻</p>
<ul><li>结构：鼻根、鼻背、鼻尖、鼻翼、鼻孔、鼻唇沟</li></ul>
<ul><li>临床：呼吸困难时出现鼻翼扇动。</li></ul>
<p>（2）鼻腔</p>
<ul><li>鼻前庭：内衬皮肤，有鼻毛，过滤空气。缺乏皮下组织，疖肿疼痛剧烈。</li></ul>
<ul><li>固有鼻腔：</li></ul>
<ul><li>鼻甲与鼻道：上、中、下鼻甲及其下方的上、中、下鼻道。</li></ul>
<ul><li>蝶筛隐窝：上鼻甲后上方，蝶窦开口于此。</li></ul>
<ul><li>鼻黏膜分区：</li></ul>
<ul><li>嗅区：上鼻甲内侧面及对应鼻中隔上部黏膜。含嗅细胞，感冒时肿胀可致嗅觉失灵。</li></ul>
<ul><li>呼吸部：其余部分，富含血管腺体，调节空气温湿度。</li></ul>
<ul><li>易出血区（Little区/Kiesselbach区）：</li></ul>
<ul><li>位置：鼻中隔前下部</li></ul>
<ul><li>临床：90%鼻出血发生于此。</li></ul>
<p>（3）鼻旁窦</p>
<ul><li>组成与开口：</li></ul>
<p class="note-img"><img src="anatomy-images/img-13.jpg" loading="lazy" alt="解剖图 13"></p>
<hr>
<p>2. 咽</p>
<ul><li>（参见消化系统，为呼吸与消化道的交叉通路）</li></ul>
<hr>
<p>3. 喉</p>
<p>（1）位置</p>
<ul><li>位于颈前正中，C3–C6水平。</li></ul>
<ul><li>上界：会厌上缘（平C3）</li></ul>
<ul><li>下界：环状软骨下缘（平C6）</li></ul>
<ul><li>特点：可随吞咽、发音上下移动。</li></ul>
<p>（2）喉软骨</p>
<ul><li>甲状软骨：最大，构成喉前壁与侧壁，前角形成喉结（男性明显）。</li></ul>
<ul><li>环状软骨：唯一完整的环形软骨，位于甲状软骨下方，支撑呼吸道。临床：此处受重击可导致喉狭窄、窒息。</li></ul>
<ul><li>会厌软骨：叶片状，吞咽时盖住喉口，防止误吸。</li></ul>
<ul><li>勺状软骨：一对，有声带突（附着声韧带）和肌突（附着喉肌）。</li></ul>
<p>（3）喉的连接</p>
<ul><li>环甲关节：运动使声带紧张或松弛。</li></ul>
<ul><li>环杓关节：运动使声门开大或缩小。</li></ul>
<ul><li>弹性圆锥：</li></ul>
<ul><li>圆锥形弹性纤维膜，上缘游离增厚为声韧带。</li></ul>
<ul><li>前份增厚为环甲正中韧带。</li></ul>
<ul><li>临床：环甲膜穿刺/切开术的急救部位。</li></ul>
<p>（4）喉肌</p>
<ul><li>功能：控制声门大小、声带松紧。</li></ul>
<ul><li>主要肌肉：</li></ul>
<ul><li>环甲肌：紧张并拉长声带，提高音调。</li></ul>
<ul><li>环杓后肌：开大声门。</li></ul>
<ul><li>环杓侧肌/杓横肌：缩小声门。</li></ul>
<p>（5）喉腔</p>
<ul><li>前庭襞（室襞）：上方皱襞，与发音无直接关系。</li></ul>
<ul><li>声襞（声带）：下方皱襞，发声器官。由声韧带、声带肌和黏膜构成。</li></ul>
<ul><li>声门裂：喉腔最狭窄处。</li></ul>
<ul><li>前3/5膜间部：与发音有关，喉癌好发部位。</li></ul>
<ul><li>后2/5软骨间部：喉结核好发部位。</li></ul>
<ul><li>声门下腔：黏膜下组织疏松，炎症时易水肿，儿童易引起喉阻塞（犬吠样咳嗽）。</li></ul>
<hr>
<p>4. 气管与主支气管</p>
<p>（1）气管</p>
<ul><li>位置：C6下缘至T4/5水平（胸骨角平面）。</li></ul>
<ul><li>结构：14-16个“C”形软骨环 + 后方膜壁。</li></ul>
<ul><li>气管杈：内面有气管隆嵴，略偏向左侧，是支气管镜检标志。</li></ul>
<ul><li>临床：气管切开术常选第3-5气管软骨环。</li></ul>
<p>（2）主支气管</p>
<ul><li>左主支气管：细、长、走向水平。</li></ul>
<ul><li>右主支气管：短、粗、走向陡直。</li></ul>
<ul><li>临床意义：气管异物更容易坠入右主支气管。</li></ul>
<ul><li>记忆口诀：左细长，右短粗，异物易入右支路。</li></ul>
<hr>
<h3>三、肺</h3>
<p>1. 位置与形态</p>
<ul><li>位置：胸腔内，纵隔两侧，膈肌上方。</li></ul>
<ul><li>形态：一尖、一底、三面、三缘</li></ul>
<ul><li>一尖：肺尖，高出锁骨内侧1/3上方2.5cm。</li></ul>
<ul><li>一底：肺底（膈面），凹向上。</li></ul>
<ul><li>三面：肋面、纵隔面、膈面。</li></ul>
<ul><li>三缘：前缘（左肺有心切迹）、后缘、下缘。</li></ul>
<ul><li>分叶：</li></ul>
<ul><li>左肺：由斜裂分为上、下两叶。</li></ul>
<ul><li>右肺：由斜裂和水平裂分为上、中、下三叶。</li></ul>
<ul><li>记忆口诀：左二右三。</li></ul>
<p>2. 肺门与肺根</p>
<ul><li>肺门：肺纵隔面中部的凹陷，为结构出入之处。</li></ul>
<ul><li>肺根：出入肺门的结构被结缔组织和胸膜包绕形成的总称。</li></ul>
<ul><li>排列关系（关键考点）：</li></ul>
<p class="note-img"><img src="anatomy-images/img-14.jpg" loading="lazy" alt="解剖图 14"></p>
<ul><li>记忆口诀： <strong>左动支静，右支动静</strong> 。</li></ul>
<ul><li>重要概念：</li></ul>
<ul><li>肺动脉：含静脉血（蓝色）</li></ul>
<ul><li>肺静脉：含动脉血（红色）——与体循环血管颜色定义相反。</li></ul>
<p>3. 支气管树与肺段</p>
<ul><li>支气管树：主支气管（一级）→ 肺叶支气管（二级）→ 肺段支气管（三级）→ … (23-25级)。</li></ul>
<ul><li>支气管肺段：</li></ul>
<ul><li>定义：每一肺段支气管及其所属的肺组织构成的一个独立结构和功能单位。</li></ul>
<ul><li>特点：呈圆锥形，尖向肺门，底向肺表面。段间有结缔组织隔开，有独立血供。</li></ul>
<ul><li>临床意义：为外科肺段切除术的解剖学基础。病变局限于某肺段时，可仅切除该段而保留健康肺组织。</li></ul>
<hr>
<p><strong>胸膜与纵隔</strong></p>
<p>1. 胸膜</p>
<ul><li>脏胸膜：紧贴肺表面，深入肺裂。</li></ul>
<ul><li>壁胸膜：分四部——胸膜顶、肋胸膜、纵隔胸膜、膈胸膜。</li></ul>
<ul><li>胸膜腔：</li></ul>
<ul><li>脏、壁胸膜在肺根处相互移行形成的潜在、封闭、负压的腔隙。</li></ul>
<ul><li>内含少量浆液，减少摩擦。</li></ul>
<p>肋膈隐窝</p>
<ul><li>位置：肋胸膜与膈胸膜反折处。</li></ul>
<ul><li>特点：胸膜腔最低、最深部位，深吸气时肺缘也不能伸入。</li></ul>
<ul><li>临床意义：胸膜腔积液（胸水）首先积聚于此，是临床胸腔穿刺抽液的首选部位。穿刺点通常在腋后线第7-9肋间。</li></ul>
<p>2. 体表投影（关键考点）</p>
<p class="note-img"><img src="anatomy-images/img-15.jpg" loading="lazy" alt="解剖图 15"></p>
<p>记忆口诀：</p>
<ul><li>肺下界：6、8、10</li></ul>
<ul><li>胸膜下界：8、10、11、12</li></ul>
<p>3. 纵隔</p>
<ul><li>定义：两侧纵隔胸膜之间所有器官、结构和结缔组织的总称。</li></ul>
<ul><li>四分法（最常用）：</li></ul>
<p>1. 上纵隔（胸骨角平面以上）：含胸腺、头臂静脉、上腔静脉、主动脉弓、膈神经、迷走神经、气管、食管、胸导管等。</p>
<p>2. 下纵隔（胸骨角平面以下）：</p>
<ul><li>前纵隔：胸骨与心包前壁之间。非常狭窄，含胸腺、淋巴结。</li></ul>
<ul><li>中纵隔：心包前后壁之间。含心包、心脏、出入心的大血管根部。</li></ul>
<ul><li>后纵隔：心包后壁与脊柱之间。含食管、胸主动脉、奇静脉、半奇静脉、迷走神经、胸导管、交感干等。</li></ul>
<p>心血管系统（心脏部分）</p>
<hr>
<h3>一、心血管系统概述</h3>
<p>1. 组成</p>
<ul><li>心：动力泵，泵血 + 内分泌功能</li></ul>
<ul><li>动脉：运送血液离开心脏，管壁厚，血流快</li></ul>
<ul><li>毛细血管：动静脉末梢间的网状结构，物质交换场所</li></ul>
<ul><li>静脉：回心管道，管壁薄，血压低</li></ul>
<p>📌 注意：</p>
<ul><li>动脉标红，静脉标蓝（除肺动脉/肺静脉例外）</li></ul>
<ul><li>血液流向：动脉由粗到细，静脉由细到粗</li></ul>
<hr>
<h3>二、血液循环路径</h3>
<p>1. 体循环（大循环）</p>
<ul><li>路径：左心室 → 主动脉 → 各级动脉 → 器官毛细血管 → 静脉 → 右心房</li></ul>
<ul><li>功能：输送氧合血至全身，回收代谢产物</li></ul>
<p>2. 肺循环（小循环）</p>
<ul><li>路径：右心室 → 肺动脉 → 肺泡毛细血管 → 肺静脉 → 左心房</li></ul>
<ul><li>功能：气体交换，将静脉血转为动脉血</li></ul>
<p>🔁 顺序总结：</p>
<p>左心室 → 体循环 → 右心房 → 右心室 → 肺循环 → 左心房 → 左心室</p>
<hr>
<h3>三、血管吻合</h3>
<p>1. 类型</p>
<ul><li>动脉间吻合：如颅底、手指末端、胃小弯等</li></ul>
<ul><li>静脉间吻合：更丰富，常形成静脉丛（如肝、盆腔）</li></ul>
<ul><li>动静脉吻合：指尖、唇、耳、生殖器等处</li></ul>
<p>2. 功能意义</p>
<ul><li>缩短循环时间，调节血流量</li></ul>
<ul><li>建立侧支循环，提高供血可靠性（如大脑动脉环）</li></ul>
<hr>
<h3>四、心脏外形与位置</h3>
<p>1. 位置</p>
<ul><li>位于中纵隔</li></ul>
<ul><li>2/3 位于前正中线左侧，1/3 位于右侧</li></ul>
<ul><li>心尖朝向左下，与正中线约成 45°角</li></ul>
<p>2. 心尖搏动点</p>
<ul><li>左侧第5肋间隙，锁骨中线内侧 1–2 cm</li></ul>
<ul><li>男性可于乳头下方内侧1–2 cm触及</li></ul>
<p>3. 心脏外形结构</p>
<ul><li>一尖：心尖</li></ul>
<ul><li>一底：心底（大血管出入处）</li></ul>
<ul><li>两面：胸肋面（前）、膈面（下）</li></ul>
<ul><li>三缘：左缘、右缘、下缘</li></ul>
<ul><li>四沟：</li></ul>
<ul><li>冠状沟（房室沟）：分隔心房与心室</li></ul>
<ul><li>前室间沟：分隔左右心室（前）</li></ul>
<ul><li>后室间沟：分隔左右心室（后）</li></ul>
<ul><li>后房间沟：分隔左右心房（后）</li></ul>
<hr>
<h3>五、心脏各腔室结构</h3>
<p>1. 右心房</p>
<ul><li>位置：心右上方（8–11点方向）</li></ul>
<ul><li>结构：</li></ul>
<ul><li>固有心房（前部，有梳状肌）</li></ul>
<ul><li>腔静脉窦（后部，有上、下腔静脉口、冠状窦口）</li></ul>
<ul><li>临床联系：</li></ul>
<ul><li>窦房结位于上腔静脉与右心耳交界处，是心脏起搏点</li></ul>
<ul><li>卵圆窝：胎儿期卵圆孔闭合后遗留，未闭可致左向右分流</li></ul>
<p>2. 右心室</p>
<ul><li>位置：胸骨左缘第4–5肋软骨后方</li></ul>
<ul><li>结构：</li></ul>
<ul><li>流入道：三尖瓣复合体（三尖瓣 + 腱索 + 乳头肌）</li></ul>
<ul><li>流出道：动脉圆锥 → 肺动脉口 → 肺动脉瓣（半月瓣）</li></ul>
<ul><li>功能：防止血液反流，控制血流方向</li></ul>
<p>3. 左心房</p>
<ul><li>位置：心底大部分，最靠后的心腔</li></ul>
<ul><li>结构：</li></ul>
<ul><li>左心耳（手术入路标志）</li></ul>
<ul><li>肺静脉口（无瓣膜）</li></ul>
<ul><li>左房室口（出口）</li></ul>
<p>4. 左心室</p>
<ul><li>位置：左后方，室壁厚度约为右心室 3倍</li></ul>
<ul><li>结构：</li></ul>
<ul><li>流入道：二尖瓣复合体（僧帽瓣）</li></ul>
<ul><li>流出道：主动脉口 → 主动脉瓣（半月瓣）</li></ul>
<ul><li>功能：泵血至全身，压力高，易发生左心衰</li></ul>
<hr>
<h3>六、心瓣膜与功能</h3>
<p class="note-tbl">瓣膜 ｜ 位置 ｜ 结构特点 ｜ 功能</p>
<p class="note-tbl">三尖瓣 ｜ 右房室口 ｜ 3个瓣叶 + 腱索 + 乳头肌 ｜ 防止右室血液反流</p>
<p class="note-tbl">二尖瓣 ｜ 左房室口 ｜ 2个瓣叶 + 腱索 + 乳头肌 ｜ 防止左室血液反流</p>
<p class="note-tbl">肺动脉瓣 ｜ 肺动脉口 ｜ 3个半月瓣 ｜ 防止肺动脉血反流</p>
<p class="note-tbl">主动脉瓣 ｜ 主动脉口 ｜ 3个半月瓣 ｜ 防止主动脉血反流</p>
<p>🩺 临床联系：</p>
<ul><li>瓣膜关闭不全/狭窄 → 心脏杂音</li></ul>
<ul><li>听诊区：二尖瓣区（心尖）、肺动脉瓣区（胸左2肋）、主动脉瓣区（胸右2肋）、三尖瓣区（胸左4肋）</li></ul>
<hr>
<h3>七、心传导系统</h3>
<ul><li>窦房结：起搏点，位于右心房与上腔静脉交界处</li></ul>
<ul><li>房室结：位于Koch三角（右心房）</li></ul>
<ul><li>房室束（His束）→ 左右束支 → Purkinje纤维</li></ul>
<p>📈 心率：</p>
<ul><li>正常成人静息心率：约75次/分</li></ul>
<ul><li>100次：窦性心动过速；&lt;50次：窦性心动过缓</li></ul>
<hr>
<h3>八、心脏纤维骨架</h3>
<ul><li>组成：四个纤维环（肺动脉、主动脉、二尖瓣、三尖瓣） + 连接韧带</li></ul>
<ul><li>功能：支撑心肌和瓣膜，防止心脏变形</li></ul>
<ul><li>老化：随年龄增长可钙化，影响心功能</li></ul>
<hr>
<h3>九、临床与手术联系</h3>
<ul><li>心内注射：胸骨左缘第4–5肋间隙</li></ul>
<ul><li>体外循环：心外科手术时替代心脏功能</li></ul>
<ul><li>卵圆孔未闭：先天性心脏病，轻者无症状，重者需封堵术</li></ul>
<ul><li>瓣膜手术：如三尖瓣修复/置换，需体外循环支持</li></ul>
<h2>第一部分：泌尿系统</h2>
<p>概述</p>
<p>泌尿系统是机体代谢产物最主要的排泄途径，由肾、输尿管、膀胱和尿道组成。核心功能为：排泄废物、调节水、电解质及酸碱平衡、维持机体内环境稳定。肾还具有内分泌功能，如分泌促红细胞生成素、肾素等。</p>
<h3>一、肾</h3>
<p>1. 形态与结构</p>
<ul><li>形态：实质性器官，左右各一，形似蚕豆。右肾因受肝脏挤压，通常比左肾低1-2cm。</li></ul>
<ul><li>肾门：位于肾内侧缘中部的凹陷，是肾动脉、肾静脉、肾盂、神经和淋巴管出入的门户。可以想象为肾脏的“总开关”所在。</li></ul>
<ul><li>肾蒂：出入肾门的所有结构被结缔组织包裹形成的“束”。其结构排列关系是重要考点（常考排序）：</li></ul>
<p>▪ 由前向后：肾静脉 → 肾动脉 → 肾盂（口诀：静动盂）</p>
<p>▪ 由上向下：肾动脉 → 肾静脉 → 肾盂（口诀：动静盂）</p>
<p>▪ 临床关联：因下腔静脉偏右，故右肾蒂较左肾蒂短，因此右肾手术难度稍大。</p>
<ul><li>肾窦：肾门向肾实质内延伸的潜在腔隙，内含肾动脉分支、肾静脉属支、肾小盏、肾大盏、肾盂以及脂肪组织，对肾脏起稳定和缓冲作用。</li></ul>
<p>2. 内部结构（冠状切面观）</p>
<ul><li>肾皮质：位于表层，富含血管，呈红褐色。由肾小体（滤过血液）和肾小管（重吸收、排泌）构成，是尿液生成的起始部位。</li></ul>
<ul><li>肾髓质：位于深层，颜色较淡，由10-18个肾锥体构成。肾锥体尖端称肾乳头，其上有许多乳头孔，生成的终尿由此排出。</li></ul>
<ul><li>尿液引流路径：肾乳头孔 → 肾小盏（漏斗状，包绕肾乳头） → （2-3个肾小盏汇合成一个）肾大盏 → （2-3个肾大盏汇合成一个）肾盂 → 输尿管。</li></ul>
<ul><li>图示关键：课件图示显示，肾皮质伸入肾锥体之间的部分称为肾柱。髓放线（肾锥体的放射状条纹）延伸至皮质。</li></ul>
<p>3. 位置与毗邻</p>
<ul><li>腹膜外位器官，紧贴腹后壁脊柱两侧。</li></ul>
<ul><li>体表投影：左肾约平第11胸椎体下缘至第2-3腰椎间盘；右肾比左肾低半个椎体。</li></ul>
<ul><li>第12肋：斜过左肾后面中部，斜过右肾后面上部。肾手术时需注意避免损伤第12肋前方的胸膜。</li></ul>
<ul><li>肾区（脊肋角）：在腰背部，竖脊肌外侧缘与第12肋的夹角处。临床意义：肾脏疾病的压痛点，肾盂肾炎时叩击此区可引起疼痛（肾叩击痛）。</li></ul>
<ul><li>毗邻关系（重要）：</li></ul>
<p>▪ 左肾：前上部与胃底和脾相邻，中部有胰尾横过，下部与空肠和结肠左曲相邻。</p>
<p>▪ 右肾：前上部与肝右叶相邻，下部与结肠右曲相邻，内侧缘与十二指肠降部紧邻。</p>
<p>▪ 两肾后面：上1/3与膈相贴，下部自内向外与腰大肌、腰方肌和腹横肌毗邻。</p>
<ul><li>临床关联：了解毗邻关系有助于诊断，如十二指肠降部溃疡可能与右肾粘连。</li></ul>
<p>4. 被膜（由内向外三层，重要）</p>
<ul><li>纤维囊：紧贴肾实质表面的薄而坚韧的结缔组织膜，正常情况下易于剥离。临床意义：肾部分切除或肾破裂时需缝合此层。</li></ul>
<ul><li>脂肪囊（肾床）：位于纤维囊外周，为富含脂肪的疏松结缔组织层。临床意义：为肾脏的弹性垫，也是肾囊封闭（如注射麻醉药）的部位。</li></ul>
<ul><li>肾筋膜：最外层，分前、后两层，在肾上方及外侧相互融合，下方则开放。功能：固定肾脏。若此结构松弛、脂肪减少，可导致肾下垂或游走肾。</li></ul>
<ul><li>图示关键：课件图示清晰显示三层被膜像“洋葱”一样包裹肾脏，肾筋膜将肾悬吊于腹后壁。</li></ul>
<h3>二、输尿管</h3>
<ul><li>分部：全长分为腹部（沿腰大肌前面下行）、盆部（沿盆壁弯曲前行）和壁内部（斜穿膀胱壁）。</li></ul>
<ul><li>三个生理性狭窄（重要考点，结石易嵌顿处）：</li></ul>
<p>1. 上狭窄：肾盂与输尿管移行处。</p>
<p>2. 中狭窄：跨过髂血管处（小骨盆上口）。</p>
<p>3. 下狭窄：壁内部（最狭窄，直径约0.2-0.3cm）。此处的斜行走向具有防止尿液从膀胱返流的功能。</p>
<ul><li>临床关联：输尿管结石卡在这些狭窄处时，会引起平滑肌痉挛，导致剧烈的肾绞痛，疼痛常向下腹部、腹股沟区或会阴部放射。</li></ul>
<h3>三、膀胱</h3>
<p>1. 形态与分部</p>
<ul><li>肌性囊状器官，其形态、大小、位置随尿液充盈程度变化显著。</li></ul>
<ul><li>分四部：膀胱尖（朝向前上）、膀胱体（主要部分）、膀胱底（朝向后下，呈三角形）、膀胱颈（最下部，与前列腺（男）或尿生殖膈（女）相接）。</li></ul>
<ul><li>容量：成人平均容量为350-500ml，最大可达800ml。新生儿容量约为成人的1/10。</li></ul>
<p>2. 内部结构——膀胱三角（非常重要）</p>
<ul><li>位置：膀胱底内面，介于两个输尿管口和尿道内口之间的三角形区域。</li></ul>
<ul><li>特点：此处粘膜与肌层紧密相连，缺少粘膜下组织，因此无论膀胱充盈或空虚，其表面始终光滑平坦，无皱襞。</li></ul>
<ul><li>临床意义：</li></ul>
<p>▪ 是膀胱肿瘤和结核的好发部位。</p>
<p>▪ 是膀胱镜检查时寻找输尿管口的标志。</p>
<p>▪ 三角区深面有丰富的神经节细胞，是通尿肌的起搏点。</p>
<p>3. 位置与毗邻（动态变化）</p>
<ul><li>空虚时：完全位于小骨盆腔内，膀胱尖不超过耻骨联合上缘。</li></ul>
<ul><li>充盈时：膀胱壁伸展上升，膀胱尖可高出耻骨联合上缘，甚至与前腹壁相贴。此时腹膜返折线也随之被推向上方。</li></ul>
<ul><li>临床意义（重要）：膀胱充盈时，因其前壁直接与腹壁接触，而无腹膜覆盖，故可在耻骨联合上方进行膀胱穿刺或手术（如膀胱造瘘术），而不会损伤腹膜、污染腹腔。</li></ul>
<ul><li>毗邻：</li></ul>
<p>▪ 男性：前方为耻骨联合，后方为精囊腺、输精管壶腹和直肠，下方邻接前列腺。</p>
<p>▪ 女性：前方为耻骨联合，后方为子宫和阴道，下方邻接尿生殖膈。</p>
<h3>四、尿道</h3>
<ul><li>性别差异显著：</li></ul>
<ul><li>女性尿道：宽（管腔直径约0.6cm）、短（长约3-5cm）、直。仅有排尿功能。尿道外口开口于阴道前庭，邻近肛门和阴道口。此解剖特点是女性尿路感染发生率远高于男性的主要原因。</li></ul>
<ul><li>男性尿道：细、长（约16-22cm）、弯曲。兼有排尿和排精功能。详见男性生殖系统部分。</li></ul>
<p>------</p>
<h2>第二部分：生殖系统</h2>
<h3>一、概述</h3>
<ul><li>功能：产生生殖细胞（精子/卵子），繁殖后代，分泌性激素以维持第二性征和性功能。</li></ul>
<ul><li>组成对比表（重要）：</li></ul>
<p class="note-img"><img src="anatomy-images/img-16.jpg" loading="lazy" alt="解剖图 16"></p>
<h3>二、男性生殖系统</h3>
<p>1. 睾丸</p>
<ul><li>功能：产生精子，分泌雄激素（主要是睾酮）。</li></ul>
<ul><li>结构：表面有坚韧的白膜，白膜在睾丸后缘增厚形成睾丸纵隔，纵隔发出睾丸小隔将睾丸实质分成200-300个睾丸小叶。每个小叶内含2-4条盘曲的精曲小管（生精场所）。小管之间的间质细胞分泌雄激素。</li></ul>
<p>2. 附睾</p>
<ul><li>形态：呈新月形，紧贴睾丸上端和后缘。</li></ul>
<ul><li>分部：膨大的头部（接收睾丸输出小管）、体部、尾部。</li></ul>
<ul><li>功能：是精子储存和进一步成熟的场所。附睾分泌的液体为精子提供营养，使其获得运动能力。</li></ul>
<p>3. 输精管与射精管</p>
<ul><li>输精管分部：睾丸部（最短） → 精索部（介于睾丸上端与腹股沟管浅环之间，位置表浅，是输精管结扎的常用部位） → 腹股沟管部 → 盆部（最长，末端膨大为输精管壶腹）。</li></ul>
<ul><li>精索：从腹股沟管深环至睾丸上端的索状结构，内含输精管、睾丸动脉、蔓状静脉丛、神经和淋巴管。被膜由内向外为：精索内筋膜、提睾肌、精索外筋膜。</li></ul>
<ul><li>射精管：由输精管壶腹末端与精囊腺排泄管汇合而成，极短，穿透前列腺实质，开口于尿道前列腺部。</li></ul>
<p>4. 附属腺</p>
<ul><li>精囊：位于膀胱底后方，输精管壶腹的外侧。其分泌物参与组成精液，呈碱性，富含果糖，为精子提供能量。</li></ul>
<ul><li>前列腺：</li></ul>
<p>▪ 形态：栗子形，底向上接膀胱颈，尖向下抵尿生殖膈。尿道贯穿其中。后面有前列腺沟。</p>
<p>▪ 临床意义：直肠指诊可触及前列腺大小、硬度及前列腺沟。良性前列腺增生（多见于老年）可压迫尿道导致排尿困难；前列腺癌可致前列腺沟消失。</p>
<ul><li>尿道球腺：一对豌豆大小的腺体，开口于尿道球部。性兴奋时分泌清亮黏液，起润滑作用。</li></ul>
<p>5. 外生殖器</p>
<ul><li>阴囊：皮肤囊袋，壁含肉膜（平滑肌），可调节温度（遇冷收缩，遇热舒张），以利于精子生存。</li></ul>
<ul><li>阴茎：</li></ul>
<p>▪ 构成：由2条阴茎海绵体（位于背侧，主导勃起）和1条尿道海绵体（位于腹侧，内有尿道通过）组成。</p>
<p>▪ 临床意义：包皮环切术时务必注意保护包皮系带，以免影响勃起功能。</p>
<p>6. 男性尿道（三个分部、三个狭窄、两个弯曲，极重要）</p>
<ul><li>分部：</li></ul>
<p>▪ 前列腺部：最宽，后壁有精阜和射精管开口。</p>
<p>▪ 膜部：最短，穿过尿生殖膈，周围有尿道括约肌（骨骼肌）环绕，可控排尿。</p>
<p>▪ 海绵体部：最长，穿行于尿道海绵体内。</p>
<ul><li>三个狭窄：尿道内口、膜部、尿道外口（最窄）。</li></ul>
<ul><li>两个弯曲：</li></ul>
<p>▪ 耻骨下弯：位于耻骨联合下方，凹向上，固定不变。</p>
<p>▪ 耻骨前弯：位于耻骨联合前下方，凹向下，将阴茎向上提起时，此弯曲可消失。</p>
<ul><li>临床关联：导尿或插入膀胱镜时，需顺应这些弯曲和狭窄，操作轻柔，避免损伤。</li></ul>
<h3>三、女性生殖系统</h3>
<p>1. 卵巢</p>
<ul><li>功能：产生卵子，分泌雌激素和孕激素。</li></ul>
<ul><li>排卵方式：破溃式排入腹膜腔。</li></ul>
<ul><li>固定装置：卵巢悬韧带（内含血管神经，又称骨盆漏斗韧带）和卵巢固有韧带。</li></ul>
<p>2. 输卵管（由内向外分四部，极重要）</p>
<ul><li>子宫部：穿行于子宫壁内的部分。</li></ul>
<ul><li>峡部：短、直、壁厚，血管较少，是输卵管结扎术的首选部位。</li></ul>
<ul><li>壶腹部：管腔粗大且弯曲，占全长的2/3，是正常情况下受精发生的部位。</li></ul>
<ul><li>漏斗部：末端呈漏斗状，其游离缘有许多指状突起称输卵管伞，是手术中识别输卵管的标志。</li></ul>
<ul><li>临床关联：若受精卵在输卵管内着床发育，称为输卵管妊娠（宫外孕），非常危险，可导致输卵管破裂大出血。</li></ul>
<p>3. 子宫</p>
<ul><li>形态与分部：倒置梨形，壁厚腔小。分三部：子宫底（输卵管入口以上）、子宫体（主体）、子宫颈（下端，部分突入阴道）。</li></ul>
<ul><li>子宫峡：子宫体与子宫颈之间的狭窄部分。非妊娠期仅1cm，妊娠后期可伸展至7-10cm，形成子宫下段，是剖宫产的手术切口部位。</li></ul>
<ul><li>位置与固定：位于盆腔中央，膀胱与直肠之间。正常姿势为前倾（子宫长轴与阴道长轴呈向前开放的角度）和前屈（子宫体与子宫颈之间向前弯曲）。固定装置包括：</li></ul>
<p>▪ 子宫阔韧带：限制子宫向两侧移动。</p>
<p>▪ 子宫圆韧带：维持前倾。</p>
<p>▪ 子宫主韧带：防止子宫脱垂（最重要）。</p>
<p>▪ 骶子宫韧带：维持前屈。</p>
<ul><li>临床关联：子宫脱垂常见于多产、产后恢复不佳的妇女。宫颈癌与高危型HPV持续感染密切相关。</li></ul>
<p>4. 阴道</p>
<ul><li>阴道穹：子宫颈突入阴道，其与阴道壁之间的环形凹陷。分前、后和两侧穹窿。其中后穹窿最深，与直肠子宫陷凹（腹腔最低点）仅隔一层阴道壁。</li></ul>
<ul><li>临床关联：阴道后穹窿穿刺可用于诊断腹腔内出血（如宫外孕）或积液。</li></ul>
<p>5. 女性乳房</p>
<ul><li>结构：由15-20个乳腺叶构成，每个腺叶有输乳管开口于乳头。Cooper韧带（乳房悬韧带）连接皮肤与深筋膜，有支持作用。</li></ul>
<ul><li>临床关联：乳腺癌侵及Cooper韧带时，可牵拉皮肤产生“酒窝征”或“橘皮样”改变。乳腺癌最常发生于外上象限。</li></ul>
<h3>四、会阴</h3>
<ul><li>狭义会阴（产科会阴）：指肛门与外生殖器（阴道前庭）之间的软组织区域。分娩时此区域承受巨大压力，易发生撕裂，故常实施会阴侧切术以保护该结构。</li></ul>
<ul><li>广义会阴：指封闭骨盆下口的所有软组织，呈菱形。</li></ul>
<h3>一、 心血管系统概述</h3>
<p>1. 组成：</p>
<ul><li>心：动力泵，具有泵血和内分泌功能。</li></ul>
<ul><li>动脉：运送血液离开心脏的管道，管壁厚，血流快。</li></ul>
<ul><li>毛细血管：连接动、静脉末梢，是物质交换的场所。</li></ul>
<ul><li>静脉：引导血液回心的管道，管壁薄，血压低。</li></ul>
<ul><li>📌 注意：除肺动脉/肺静脉外，常规图示中动脉标红，静脉标蓝。</li></ul>
<p>2. 血液循环路径：</p>
<ul><li>体循环（大循环）：左心室 → 主动脉 → 各级动脉 → 全身毛细血管 → 各级静脉 → 上/下腔静脉 → 右心房。功能：输送氧和营养物质，回收代谢产物。</li></ul>
<ul><li>肺循环（小循环）：右心室 → 肺动脉 → 肺泡毛细血管 → 肺静脉 → 左心房。功能：进行气体交换，将静脉血转为动脉血。</li></ul>
<ul><li>🔁 完整顺序：左心室 → 体循环 → 右心房 → 右心室 → 肺循环 → 左心房 → 左心室。</li></ul>
<p>3. 血管吻合：</p>
<ul><li>类型：动脉间吻合（如掌浅弓、掌深弓）、静脉间吻合（更丰富，常形成静脉丛）、动静脉吻合（指尖、唇等处）。</li></ul>
<ul><li>意义：缩短循环时间，调节血流量；建立侧支循环，提高供血可靠性。</li></ul>
<hr>
<h3>二、 心</h3>
<p>（一）心的外形与位置</p>
<p>1. 位置：位于胸腔中纵隔内，外裹心包。约2/3位于身体正中线左侧，1/3位于右侧。心尖朝向左前下方。</p>
<p>2. 心尖搏动点：左侧第5肋间隙，锁骨中线内侧1-2cm处。</p>
<p>3. 外形结构（一尖一底两面三缘四沟）：</p>
<ul><li>一尖：心尖，由左心室构成。</li></ul>
<ul><li>一底：心底，朝向右后上方，主要由左心房构成，与大血管相连。</li></ul>
<ul><li>两面：胸肋面（前面，大部分由右心房和右心室构成）、膈面（下面，大部分由左心室构成）。</li></ul>
<ul><li>三缘：右缘（垂直，由右心房构成）、左缘（钝圆，主要由左心室构成）、下缘（水平，由右心室和心尖构成）。</li></ul>
<ul><li>四沟：</li></ul>
<ul><li>冠状沟：近似环形，是心房与心室在心表面的分界。</li></ul>
<ul><li>前室间沟：左右心室在胸肋面的分界。</li></ul>
<ul><li>后室间沟：左右心室在膈面的分界。</li></ul>
<ul><li>后房间沟：左右心房在心底的分界。</li></ul>
<p>（二）心腔结构（核心考点）</p>
<p>心腔以“钟面”关系记忆（水平切面）：右心室（5-8点）、右心房（8-11点）、左心房（11-1点）、左心室（2-5点）。</p>
<p>1. 右心房：</p>
<ul><li>入口：上腔静脉口、下腔静脉口、冠状窦口。</li></ul>
<ul><li>出口：右房室口。</li></ul>
<ul><li>重要结构：卵圆窝（房间隔下部，胎儿卵圆孔闭锁遗迹，未闭为先天性心脏病）、Koch三角（冠状窦口前内缘、三尖瓣隔侧尖附着缘和Todaro腱之间的三角区，房室结位于此）。</li></ul>
<p>2. 右心室：</p>
<ul><li>流入道：三尖瓣复合体（三尖瓣 + 腱索 + 乳头肌），防止血液从右心室反流回右心房。</li></ul>
<ul><li>流出道：动脉圆锥 → 肺动脉口 → 肺动脉瓣（三个半月瓣），防止血液从肺动脉反流回右心室。</li></ul>
<p>3. 左心房：</p>
<ul><li>入口：左、右各两条肺静脉口。</li></ul>
<ul><li>出口：左房室口。</li></ul>
<ul><li>重要结构：左心耳（心外科手术常用入路）。</li></ul>
<p>4. 左心室：</p>
<ul><li>流入道：二尖瓣复合体（二尖瓣 + 腱索 + 乳头肌），防止血液从左心室反流回左心房。</li></ul>
<ul><li>流出道：主动脉前庭 → 主动脉口 → 主动脉瓣（三个半月瓣），防止血液从主动脉反流回左心室。左心室壁最厚，约为右心室壁的3倍。</li></ul>
<p>（三）心壁与心间隔</p>
<p>1. 心壁：</p>
<ul><li>心内膜：衬于腔内，光滑。心瓣膜由其折叠而成。</li></ul>
<ul><li>心肌层：心室肌远厚于心房肌，左心室肌最厚。心房肌与心室肌不连续，被纤维环隔开。</li></ul>
<ul><li>心外膜：即浆膜心包的脏层。</li></ul>
<p>2. 心间隔：</p>
<ul><li>房间隔：分隔左、右心房，最薄处为卵圆窝。</li></ul>
<ul><li>室间隔：</li></ul>
<ul><li>肌部：占大部分。</li></ul>
<ul><li>膜部：上部一小区域，缺乏肌质，是室间隔缺损的好发部位。</li></ul>
<p>（四）心的传导系统（由特殊心肌细胞构成）</p>
<p>1. 窦房结：</p>
<ul><li>位置：上腔静脉与右心房交界处界沟上1/3的心外膜深面。</li></ul>
<ul><li>功能：心的正常起搏点。</li></ul>
<p>2. 房室结：</p>
<ul><li>位置：Koch三角内，冠状窦口与右房室口之间。</li></ul>
<ul><li>功能：将窦房结的冲动传向心室，产生房室延搁，保证心房收缩后心室再收缩。是潜在的次级起搏点。</li></ul>
<p>3. 房室束（His束）：连接心房和心室的唯一通路，下行分为左、右束支。</p>
<p>4. 左、右束支及Purkinje纤维网：分布于室间隔和心室壁，最终与普通心肌细胞相连。</p>
<p>5. 传导路径：窦房结 → 结间束 → 房室结 → 房室束 → 左、右束支 → Purkinje纤维网 → 心室肌。</p>
<p>6. 临床：异常传导通路（如Kent束）可导致预激综合征。</p>
<p>（五）心的血管</p>
<p>1. 动脉 - 冠状动脉：</p>
<ul><li>左冠状动脉：</li></ul>
<ul><li>前室间支（前降支）：沿前室间沟下行，绕过心尖。分布于左心室前壁、右心室部分前壁、室间隔前2/3。</li></ul>
<ul><li>旋支：沿冠状沟左行。分布于左心房、左心室侧壁和后壁。</li></ul>
<ul><li>右冠状动脉：</li></ul>
<ul><li>行于右冠状沟，至房室交点处常分为两支。</li></ul>
<ul><li>后室间支（后降支）：沿后室间沟下行。分布于右心室大部、左心室部分后壁、室间隔后1/3。</li></ul>
<ul><li>左室后支：分布于左心室后壁。</li></ul>
<ul><li>重要分支：窦房结支（约60%起自右冠状动脉）、房室结支（约90%起自右冠状动脉）。</li></ul>
<ul><li>冠脉分布类型：右优势型（65%）、均衡型、左优势型。决定了心肌梗塞的易发部位和严重程度。</li></ul>
<p><strong>&gt;前室间支沿前室间沟下行，绕过心尖右侧，直后室间沟下部与右冠状动脉的后室间支吻合</strong></p>
<p>2. 静脉：</p>
<ul><li>大多汇入冠状窦，开口于右心房。</li></ul>
<ul><li>冠状窦主要属支：心大静脉、心中静脉、心小静脉。</li></ul>
<p>（六）心包</p>
<ul><li>纤维心包：外层，坚韧。</li></ul>
<ul><li>浆膜心包：</li></ul>
<ul><li>脏层：即心外膜。</li></ul>
<ul><li>壁层：衬于纤维心包内面。</li></ul>
<ul><li>心包腔：脏、壁两层之间的潜在腔隙，内含少量浆液起润滑作用。</li></ul>
<ul><li>心包窦：心包腔内浆膜反折形成的间隙，如心包横窦（心血管根部后方）。</li></ul>
<hr>
<h3>三、 血管</h3>
<p>（一）动脉</p>
<p>器官外动脉分布规律：对称性、躯干分壁支与脏支、多位于身体屈侧或安全隐蔽部位、常以最短距离到达器官、分布形式与器官形态相适应。</p>
<p><strong>一、肺循环动脉</strong></p>
<ul><li>肺动脉干：</li></ul>
<ul><li>起源：右心室肺动脉口。</li></ul>
<ul><li>走行：在升主动脉前方向左后上斜行，至主动脉弓下方分为左、右肺动脉。</li></ul>
<ul><li>左肺动脉：较短，横行至左肺门，分上、下两支入左肺上、下叶。</li></ul>
<ul><li>右肺动脉：较长，经升主动脉和上腔静脉后方右行，至右肺门分三支入右肺上、中、下叶。</li></ul>
<ul><li>动脉韧带：</li></ul>
<ul><li>位置：肺动脉干分叉处稍左侧与主动脉弓下缘之间。</li></ul>
<ul><li>本质：胚胎时期动脉导管闭锁后的遗迹。</li></ul>
<ul><li>临床：出生后6个月未闭，即为 *动脉导管未闭* （先天性心脏病之一）。</li></ul>
<hr>
<p><strong>二、体循环动脉主干：主动脉</strong></p>
<p>分段与走行：</p>
<p>1. 升主动脉：</p>
<ul><li>起自左心室，斜向右上前，至第2胸肋关节后方移行为主动脉弓。</li></ul>
<ul><li>分支：左、右冠状动脉。</li></ul>
<p>2. 主动脉弓：</p>
<ul><li>凸侧从右向左依次发出三大分支：</li></ul>
<ul><li><strong>头臂干（无名动脉）</strong> → 在右胸锁关节后方分为 右颈总动脉 和 右锁骨下动脉 。</li></ul>
<ul><li>左颈总动脉。</li></ul>
<ul><li>左锁骨下动脉。</li></ul>
<p>3. 降主动脉：</p>
<ul><li>以膈为界，分为：</li></ul>
<ul><li>胸主动脉：位于主动脉裂孔以上。</li></ul>
<ul><li>腹主动脉：位于主动脉裂孔以下，至第4腰椎下缘分叉为左、右髂总动脉。</li></ul>
<hr>
<p><strong>三、头颈部动脉</strong></p>
<p>1. 颈总动脉</p>
<ul><li>体表投影：下颌角与乳突尖连线中点至胸锁关节的连线。</li></ul>
<ul><li>分界：甲状软骨上缘以上为颈外动脉，以下为颈总动脉。</li></ul>
<ul><li>摸脉点与止血：于环状软骨外侧（颈动脉三角）可摸到搏动。向后内压向第6颈椎横突，可进行头面部止血。</li></ul>
<ul><li>颈动脉鞘内容：颈总动脉（外侧）、颈内静脉（内侧）、迷走神经（后方）。</li></ul>
<ul><li>特殊结构：</li></ul>
<ul><li>颈动脉窦：颈总动脉末端与颈内动脉起始部的膨大，为压力感受器。</li></ul>
<ul><li>颈动脉小球：扁椭圆形小体，位于分叉处后方，为化学感受器（感受血中氢离子浓度）。</li></ul>
<p>2. 颈外动脉</p>
<ul><li>主要分支（从下至上）：</li></ul>
<p>1. 甲状腺上动脉：分布于甲状腺和喉。</p>
<p>2. 舌动脉：分布于舌、口腔底、腭扁桃体。</p>
<p>3. 面动脉：</p>
<ul><li>走行：经下颌下腺深面，在咬肌前缘绕下颌骨下缘至面部，沿口角、鼻翼迂曲上行至内眦，移行为内眦动脉。</li></ul>
<ul><li>分布：腭扁桃体、下颌下腺、面部。</li></ul>
<ul><li>摸脉点与止血：在咬肌前缘下颌骨下缘处可摸到搏动，压向下颌骨可止眼裂以下面部出血。</li></ul>
<p>4. 颞浅动脉：</p>
<ul><li>走行：经外耳门前方，越颧弓根至颞部。</li></ul>
<ul><li>分布：腮腺、颞、顶、额部软组织。</li></ul>
<ul><li>摸脉点与止血：在外耳门前方、颧弓后端可摸到搏动，压向颧弓可止颞部和头顶部出血。</li></ul>
<p>5. 上颌动脉：</p>
<ul><li>走行：经下颌颈深面入颞下窝。</li></ul>
<ul><li>重要分支：脑膜中动脉 → 穿 <strong>*棘孔</strong>* 入颅，分前、后两支分布于硬脑膜。前支经翼点内面，翼点骨折易损伤导致硬膜外血肿。脑膜中动脉为其主要分支。</li></ul>
<p>3. 颈内动脉</p>
<ul><li>特点：在颈部无分支。</li></ul>
<ul><li>走行：垂直上行，穿颈动脉管入颅。</li></ul>
<ul><li>分布：脑和视器。</li></ul>
<hr>
<p><strong>四、上肢动脉</strong></p>
<p>1. 锁骨下动脉</p>
<ul><li>体表投影：胸锁关节至锁骨中点凸向上的弧线，最高点距锁骨上缘1.2cm。</li></ul>
<ul><li>止血部位：于锁骨上窝中点向下压向第1肋，可止肩和上肢出血。</li></ul>
<ul><li>主要分支：</li></ul>
<p>1. 椎动脉：穿第6-1颈椎横突孔，经枕骨大孔入颅，分布于脑和脊髓。</p>
<p>2. 胸廓内动脉：</p>
<ul><li>走行：沿胸骨外侧缘约1cm下行，穿膈后移行为腹壁上动脉。</li></ul>
<ul><li>分布：胸前壁、心包、膈、腹直肌（与腹壁下动脉吻合）。</li></ul>
<p>3. 甲状颈干：短干，主要分支为甲状腺下动脉。</p>
<p>2. 腋动脉</p>
<ul><li>体表投影（与肱动脉连续）：上肢外展90°，锁骨中点至肱骨内、外上髁连线中点稍下的连线。以背阔肌下缘为界，上方为腋动脉。</li></ul>
<ul><li>主要分支：</li></ul>
<ul><li>胸肩峰动脉</li></ul>
<ul><li>胸外侧动脉</li></ul>
<ul><li>肩胛下动脉：分为胸背动脉和旋肩胛动脉。</li></ul>
<ul><li>旋肱后动脉：与腋神经伴行。</li></ul>
<p>3. 肱动脉</p>
<ul><li>走行：沿肱二头肌肉侧沟下行，至桡骨颈水平分桡、尺动脉。</li></ul>
<ul><li>摸脉点与止血：在肱二头肌腱内侧（肘窝稍上方）位置表浅，为测血压听诊部位。将动脉压向肱骨，可止压迫点以下的上肢出血。</li></ul>
<ul><li>主要分支：肱深动脉，与桡神经伴行，经桡神经沟。</li></ul>
<p>4. 桡动脉</p>
<ul><li>体表投影：肱骨内、外上髁连线中点稍下方至桡骨茎突的连线。</li></ul>
<ul><li>走行：行于肱桡肌与旋前圆肌之间，至前臂下段在肱桡肌腱与桡侧腕屈肌腱之间下行，位置表浅。</li></ul>
<ul><li>摸脉点：腕上方，桡侧腕屈肌腱桡侧，为中医切脉、计数脉搏部位。</li></ul>
<ul><li>异常：反关脉——桡动脉主干在前臂中段绕至桡骨背面下行。</li></ul>
<ul><li>分支：</li></ul>
<p>1. 掌浅支：在桡腕关节处发出，参与构成掌浅弓。</p>
<p>2. 拇主要动脉：分布于拇指两侧和示指桡侧。</p>
<ul><li>终支：参与构成掌深弓。</li></ul>
<p>5. 尺动脉</p>
<ul><li>体表投影：</li></ul>
<ul><li>上段：肱骨内、外上髁连线中点稍下方至上述连线中、上1/3交点。</li></ul>
<ul><li>下段：肱骨内上髁至豌豆骨桡侧缘连线的下2/3。</li></ul>
<ul><li>走行：在尺侧腕屈肌与指浅屈肌之间下行，经豌豆骨桡侧至手掌。</li></ul>
<ul><li>分支：掌深支，穿小鱼际肌参与构成掌深弓。</li></ul>
<ul><li>终支：参与构成掌浅弓。</li></ul>
<ul><li>止血：在腕横纹两端同时压迫桡、尺动脉，可止手部出血。</li></ul>
<p>6. 手部动脉弓</p>
<ul><li>掌浅弓：</li></ul>
<ul><li>构成：尺动脉终支 + 桡动脉掌浅支。</li></ul>
<ul><li>位置：掌腱膜深面。</li></ul>
<ul><li>分支：发出3条指掌侧总动脉 → 各分为2条指掌侧面有动脉，分布于第2-5指相对缘。</li></ul>
<ul><li>掌深弓：</li></ul>
<ul><li>构成：桡动脉终支 + 尺动脉掌深支。</li></ul>
<ul><li>位置：指深屈肌腱深面。</li></ul>
<ul><li>分支：发出3条掌心动脉，注入指掌侧总动脉。</li></ul>
<ul><li>记忆口诀：“深桡浅尺”。</li></ul>
<p>7. 指掌侧面有动脉</p>
<ul><li>止血部位：在手指根部两侧压向指骨，可止手指出血。</li></ul>
<hr>
<p><strong>五、胸主动脉</strong></p>
<ul><li>分支：</li></ul>
<ul><li>壁支：9对肋间后动脉（行于第3-11肋间隙肋沟内）、1对肋下动脉。第1、2肋间后动脉来自锁骨下动脉。</li></ul>
<ul><li>脏支：支气管支、食管支、心包支。</li></ul>
<hr>
<p><strong>六、腹主动脉</strong></p>
<ul><li>壁支：腰动脉（4对）、膈下动脉、骶正中动脉。</li></ul>
<ul><li>脏支：</li></ul>
<ul><li>成对：</li></ul>
<p>1. 肾上腺中动脉：平第1腰椎高度发起。</p>
<p>2. 肾动脉：平第1腰椎下缘发起。</p>
<p>3. 睾丸动脉/卵巢动脉：</p>
<ul><li>睾丸动脉：参与组成精索。</li></ul>
<ul><li>卵巢动脉：经卵巢悬韧带下行。</li></ul>
<ul><li><strong>*不成对（重点）</strong>* ：</li></ul>
<p>1. 腹腔干：于膈主动脉裂孔下方发起，立即分为三大分支：</p>
<ul><li>胃左动脉：行于胃小弯，与胃右动脉吻合。</li></ul>
<ul><li>肝总动脉：</li></ul>
<ul><li>肝固有动脉：分肝左、右支（右支发胆囊动脉），起始部发胃右动脉。</li></ul>
<ul><li>胃十二指肠动脉：分胃网膜右动脉和胰十二指肠上动脉。</li></ul>
<ul><li>脾动脉：沿胰上缘左行，发胰支、胃短动脉、胃网膜左动脉。</li></ul>
<p>&gt;胃网膜左动脉与胃网膜右动脉汇成胃动脉弓</p>
<p>2. 肠系膜上动脉：平第1腰椎高度发起。</p>
<ul><li>分支：胰十二指肠下动脉、空肠动脉、回肠动脉、回结肠动脉（发阑尾动脉）、右结肠动脉、中结肠动脉。</li></ul>
<p>3. 肠系膜下动脉：平第3腰椎高度发起。</p>
<ul><li>分支：左结肠动脉、乙状结肠动脉（2-3支）、直肠上动脉（终支）。</li></ul>
<hr>
<p><strong>七、盆部与下肢动脉</strong></p>
<p>1. 髂总动脉</p>
<ul><li>起点：第4腰椎下缘水平由腹主动脉分叉而来。</li></ul>
<ul><li>走行：沿腰大肌内侧下行，至骶髂关节前分为髂内、外动脉。</li></ul>
<p>2. 髂内动脉</p>
<ul><li>脏支：</li></ul>
<p>1. 直肠下动脉：与直肠上动脉、肛动脉吻合。</p>
<p>2. 子宫动脉：</p>
<ul><li>走行：在子宫颈外侧约2cm处跨过输尿管前上方。</li></ul>
<ul><li>分布：子宫、卵巢、输卵管、阴道。与卵巢动脉吻合。</li></ul>
<p>3. 阴部内动脉：</p>
<ul><li>走行：经梨状肌下孔出盆，再经坐骨小孔入坐骨肛门窝。</li></ul>
<ul><li>分支：肛动脉、会阴动脉、阴茎背动脉/阴蒂背动脉。</li></ul>
<ul><li>壁支：</li></ul>
<p>1. 闭孔动脉：穿闭孔膜出盆腔。</p>
<p>2. 臀上动脉 &amp; 臀下动脉：分别经梨状肌上、下孔出盆腔。</p>
<p>3. 髂外动脉</p>
<ul><li>走行：沿腰大肌肉侧缘下行，经腹股沟韧带中点深面入股部，移行为股动脉。</li></ul>
<ul><li>分支：腹壁下动脉，进入腹直肌鞘，与腹壁上动脉吻合。</li></ul>
<p>4. 股动脉</p>
<ul><li>体表投影：大腿外展外旋，腹股沟中点至股骨内侧髁上方连线的上2/3。</li></ul>
<ul><li>摸脉点与止血：在腹股沟中点稍下方可摸到搏动，压向耻骨上支，可止下肢出血。</li></ul>
<ul><li>主要分支：股深动脉，在股动脉起始部下方2-5cm处发出。</li></ul>
<p>5. 腘动脉</p>
<ul><li>走行：在腘窝深面下行，至腘窝下角分胫前、胫后动脉。</li></ul>
<ul><li>止血：在腘窝加垫，屈膝包扎。</li></ul>
<p>6. 胫后动脉</p>
<ul><li>体表投影：腘窝稍下方至内踝与跟结节连线中点。</li></ul>
<ul><li>走行：在小腿后群肌浅、深两层间下行，经内踝后方入足底，分为足底内、外侧动脉。</li></ul>
<ul><li>分支：腓动脉。</li></ul>
<ul><li>摸脉点与止血：在内踝与跟结节之间可摸到搏动，压向深部可减轻足底出血。</li></ul>
<p>7. 胫前动脉</p>
<ul><li>走行：穿小腿骨间膜上端至小腿前面，在小腿前群肌之间下行，至踝关节前方移行为足背动脉。</li></ul>
<p>8. 足背动脉</p>
<ul><li>体表投影：胫骨粗隆与腓骨头连线中点至第1跖骨间隙近侧部的连线，踝关节以下部分为足背动脉投影。</li></ul>
<ul><li>走行：经踇长伸肌腱与趾长伸肌腱之间前行。</li></ul>
<ul><li>摸脉点与止血：在踇长伸肌腱外侧可摸到搏动（跌阳脉），向下压迫可减轻足背出血。</li></ul>
<hr>
<p>附：临床要点总结</p>
<p>1. 止血点：笔记中各动脉已详细标注，是急救关键。</p>
<p>2. 摸脉点：桡动脉（主要）、颈总动脉、面动脉、颞浅动脉、肱动脉、股动脉、足背动脉、胫后动脉。</p>
<p>3. 重要吻合：</p>
<ul><li>掌浅弓与掌深弓</li></ul>
<ul><li>胃网膜左、右动脉</li></ul>
<ul><li>腹壁上、下动脉</li></ul>
<ul><li>直肠上、下动脉</li></ul>
<p>4. 常见临床疾病：</p>
<ul><li>动脉导管未闭</li></ul>
<ul><li>冠心病（冠状动脉阻塞）</li></ul>
<ul><li>翼点骨折→脑膜中动脉破裂→硬膜外血肿</li></ul>
<ul><li>桡动脉变异（反关脉、斜飞脉）</li></ul>

<p class="note-img"><img src="anatomy-images/img-18.jpg" loading="lazy" alt="解剖图 18"></p>
<p>（二）静脉</p>
<p>1. 静脉特点：</p>
<ul><li>数量多、管腔大、管壁薄、弹性小、血流慢。</li></ul>
<ul><li>静脉瓣：防止血液逆流，下肢静脉瓣最多。</li></ul>
<ul><li>分类：浅静脉（位于皮下，最终注入深静脉，是注射、抽血部位）、深静脉（与同名动脉伴行）。</li></ul>
<ul><li>特殊静脉：硬脑膜窦、板障静脉。</li></ul>
<p>2. 肺循环静脉：</p>
<ul><li>左、右肺静脉：每侧各有两条（左上、左下；右上、右下），注入左心房。输送动脉血。</li></ul>
<p>3. 体循环静脉（三大系统）：</p>
<ul><li>上腔静脉系、下腔静脉系、心静脉系（已述）。</li></ul>
<ul><li>肝门静脉系（特点：起止均为毛细血管、无瓣膜）：</li></ul>
<ul><li>主要属支：脾静脉、肠系膜上静脉、肠系膜下静脉、胃左静脉、胃右静脉等。</li></ul>
<ul><li>门-腔静脉吻合（肝硬化门脉高压时，这些部位可出现静脉曲张甚至破裂出血）：</li></ul>
<ul><li>食管静脉丛：门静脉→胃左静脉→食管静脉丛→奇静脉→上腔静脉。</li></ul>
<ul><li>直肠静脉丛：门静脉→肠系膜下静脉→直肠上静脉→直肠静脉丛→直肠下静脉/肛静脉→髂内静脉→下腔静脉。</li></ul>
<ul><li>脐周静脉网：门静脉→附脐静脉→脐周静脉网→胸腹壁静脉/腹壁浅静脉→上/下腔静脉。</li></ul>
<hr>
<p>解剖学内分泌系统复习笔记</p>
<h3>一、 概述</h3>
<p>1. 组成：</p>
<ul><li>内分泌腺：无导管，分泌物（激素）直接进入血液或淋巴，作用于靶器官或靶细胞。如垂体、甲状腺、肾上腺等。</li></ul>
<ul><li>内分泌组织：以细胞团的形式分散于其他器官中。如胰腺内的胰岛、睾丸内的间质细胞、卵巢内的卵泡细胞和黄体等。</li></ul>
<p>2. 功能：分泌的激素对人体的新陈代谢、生长发育、生殖等起到至关重要的调节作用，与神经系统相辅相成，维持机体内环境稳定。</p>
<p>3. 激素分类：含氮激素、类固醇（甾体）激素。</p>
<hr>
<h3>二、 各内分泌腺详解</h3>
<p>（一）甲状腺</p>
<ul><li>形态与位置：</li></ul>
<ul><li>位于颈前部，喉和气管上部的前外侧。</li></ul>
<ul><li>呈棕红色“H”形，由左、右两个侧叶和中间的甲状腺峡组成。有时从峡部向上伸出一个锥状叶。</li></ul>
<ul><li>峡部位于第2-4气管软骨环前方。</li></ul>
<ul><li>被膜：外层为颈深筋膜形成的气管前筋膜（假被膜），内层为纤维囊（真被膜），后者深入腺实质，将其分为若干小叶。</li></ul>
<ul><li>功能：分泌甲状腺激素。</li></ul>
<ul><li>作用：调节机体新陈代谢，促进生长发育，尤其对骨骼和神经系统的发育至关重要。</li></ul>
<ul><li>临床联系：</li></ul>
<ul><li>功能亢进（甲亢）：代谢亢进，食欲增加但体重减轻，情绪激动，眼球突出（突眼症）。</li></ul>
<ul><li>功能减退（甲减）：</li></ul>
<ul><li>成人：黏液性水肿。</li></ul>
<ul><li>婴幼儿：呆小症（智力低下、身材矮小）。</li></ul>
<p>（二）甲状旁腺</p>
<ul><li>形态与位置：</li></ul>
<ul><li>两对（4个），黄豆大小，呈扁椭圆形。</li></ul>
<ul><li>位于甲状腺侧叶的后缘，上下各一对。上对位置较固定，下对位置变异较大。</li></ul>
<ul><li>功能：分泌甲状旁腺激素。</li></ul>
<ul><li>作用：调节钙磷代谢，维持血钙平衡（升高血钙）。</li></ul>
<ul><li>临床联系：</li></ul>
<ul><li>手术误切：导致血钙降低，引起手足抽搐。</li></ul>
<ul><li>功能亢进：导致骨质疏松，易发生骨折。</li></ul>
<p>（三）肾上腺</p>
<ul><li>形态与位置：</li></ul>
<ul><li>一对，位于腹膜后隙，脊柱两侧，肾脏的上内方，与肾共同包被于肾筋膜内。</li></ul>
<ul><li>左肾上腺：近似半月形。</li></ul>
<ul><li>右肾上腺：呈三角形。</li></ul>
<ul><li>结构与功能：</li></ul>
<ul><li>皮质（占90%）：</li></ul>
<ul><li>球状带：分泌盐皮质激素（如醛固酮），调节水盐代谢。</li></ul>
<ul><li>束状带：分泌糖皮质激素（如皮质醇），调节碳水化合物代谢。</li></ul>
<ul><li>网状带：分泌性激素（雄激素为主）。</li></ul>
<ul><li>髓质：</li></ul>
<ul><li>分泌肾上腺素和去甲肾上腺素。</li></ul>
<ul><li>作用：使心跳加快、心收缩力加强、小动脉收缩、血压升高。作用与交感神经兴奋相似（“战斗或逃跑”反应）。</li></ul>
<p>（四）垂体（最重要的内分泌腺）</p>
<ul><li>形态与位置：</li></ul>
<ul><li>椭圆形，位于颅底蝶鞍的垂体窝内，借漏斗与下丘脑相连。</li></ul>
<ul><li>分部与功能：</li></ul>
<ul><li>腺垂体（前叶）：</li></ul>
<ul><li>远侧部、结节部。</li></ul>
<ul><li>分泌激素：</li></ul>
<ul><li>生长激素：促进骨和软组织生长。</li></ul>
<ul><li>促甲状腺激素：促进甲状腺发育和分泌。</li></ul>
<ul><li>促肾上腺皮质激素：促进肾上腺皮质分泌。</li></ul>
<ul><li>促性腺激素：促进性腺发育和分泌。</li></ul>
<ul><li>神经垂体（后叶）：</li></ul>
<ul><li>神经部、漏斗。</li></ul>
<ul><li>不分泌激素，而是储存和释放由下丘脑合成的两种激素：</li></ul>
<ul><li>抗利尿激素：促进肾对水的重吸收，使尿量减少。大剂量可使血管收缩，血压升高，故又称血管升压素。</li></ul>
<ul><li>催产素：促进子宫平滑肌收缩和乳腺泌乳。</li></ul>
<ul><li>临床联系：</li></ul>
<ul><li>生长激素过多：</li></ul>
<ul><li>幼年：巨人症。</li></ul>
<ul><li>成年：肢端肥大症。</li></ul>
<ul><li>生长激素过少：幼年：侏儒症（智力正常）。</li></ul>
<p>（五）松果体</p>
<ul><li>形态与位置：</li></ul>
<ul><li>位于背侧丘脑的后上方，形似松果，以细柄连于第三脑室顶的后部。</li></ul>
<ul><li>功能：分泌褪黑素。</li></ul>
<ul><li>作用：调节昼夜节律和睡眠；抑制生殖系统发育，防止性早熟。</li></ul>
<ul><li>临床联系：儿童期松果体病变导致功能不全，可引发性早熟。成年后松果体常钙化，形成“脑砂”。</li></ul>
<p>（六）胸腺（兼有淋巴和内分泌功能）</p>
<ul><li>形态与位置：</li></ul>
<ul><li>位于上纵隔前部，胸骨柄后方。</li></ul>
<ul><li>呈不对称的左、右两叶，青春期后逐渐退化，被脂肪组织代替。</li></ul>
<ul><li>功能：</li></ul>
<ul><li>淋巴功能：培育、选择和使T淋巴细胞成熟。</li></ul>
<ul><li>内分泌功能：分泌胸腺素、促胸腺生成素等，促进T淋巴细胞的发育和成熟。</li></ul>
<p>（七）胰岛（胰腺的内分泌部）</p>
<ul><li>位置：散在于胰腺实质内，胰尾处较多。</li></ul>
<ul><li>细胞与功能：</li></ul>
<ul><li>β细胞：分泌胰岛素——降低血糖。</li></ul>
<ul><li>α细胞：分泌胰高血糖素——升高血糖。</li></ul>
<ul><li>临床联系：胰岛素分泌不足 → 糖尿病。胰岛素是人体内唯一的降糖激素。</li></ul>
<p>（八）生殖腺</p>
<ul><li>睾丸：间质细胞分泌雄激素（主要是睾酮），促进男性生殖器官发育和维持第二性征。</li></ul>
<ul><li>卵巢：</li></ul>
<ul><li>卵泡细胞分泌雌激素。</li></ul>
<ul><li>黄体分泌孕激素和雌激素。</li></ul>
<ul><li>作用：促进女性生殖器官发育，维持第二性征和月经周期，为受精卵着床做准备。</li></ul>
<hr>
<h3>三、 激素与功能总结表</h3>
<p class="note-img"><img src="anatomy-images/img-19.jpg" loading="lazy" alt="解剖图 19"></p>
<p><strong>第一部分：静脉系统</strong></p>
<p>静脉是运送血液回心的血管，起自毛细血管，止于心房。</p>
<h3>一、静脉的特点（与动脉相比）</h3>
<p><strong>· 数量多、管径粗、腔大、壁薄、弹性小。</strong></p>
<p><strong>· 静脉瓣</strong> ：由内皮折叠形成，呈半月形，游离缘朝向心脏，防止血液逆流。四肢静脉瓣膜多，躯干静脉瓣膜少或无。</p>
<ul><li>分浅、深两类：</li></ul>
<p>*· 浅静脉* （皮下静脉）：位于皮下浅筋膜内，不与动脉伴行，最终注入深静脉。临床常用于采血、输液。</p>
<p>*· 深静脉* （伴行静脉）：位于深筋膜深面，与同名动脉伴行，其收集范围与伴行动脉的分布范围大致相同。</p>
<ul><li>吻合丰富：浅静脉间吻合成网，深静脉在脏器周围或壁内形成静脉丛，浅深静脉间有交通支。利于侧支循环建立。</li></ul>
<ul><li>特殊结构：</li></ul>
<ul><li>硬脑膜窦：位于颅内，无平滑肌，无瓣膜，壁不易塌陷。</li></ul>
<ul><li>板障静脉：位于颅骨板障内，连接头皮静脉与颅内静脉。</li></ul>
<p><strong>二、肺循环的静脉</strong></p>
<ul><li><strong>左、右肺静脉（各两条）</strong> ：左上、左下肺静脉；右上、右下肺静脉。</li></ul>
<ul><li><strong>功能</strong> ：输送含氧量高的动脉血回左心房。</li></ul>
<ul><li><strong>收集范围</strong> ：</li></ul>
<ul><li>左上、左下肺静脉收集左肺上、下叶血液。</li></ul>
<ul><li>右上肺静脉收集右肺上、中叶血液。</li></ul>
<ul><li>右下肺静脉收集右肺下叶血液。</li></ul>
<p><strong>三、体循环的静脉</strong></p>
<p>体循环的静脉分为上腔静脉系和下腔静脉系。</p>
<p><strong>（一）上腔静脉系</strong></p>
<p>收集头颈、上肢、胸部（除心和肺）的静脉血。</p>
<ul><li>上腔静脉 ：</li></ul>
<ul><li>由左、右头臂静脉在右侧第1胸肋结合处后方汇合而成。</li></ul>
<ul><li>沿升主动脉右侧下行，至第3胸肋关节水平注入右心房。</li></ul>
<ul><li>在注入前接受奇静脉。</li></ul>
<ul><li>头臂静脉 ：</li></ul>
<ul><li>由同侧颈内静脉和锁骨下静脉在胸锁关节后方汇合而成。</li></ul>
<ul><li>汇合处形成的夹角称为静脉角，是淋巴导管的注入部位。</li></ul>
<ul><li>还收集椎静脉、胸廓内静脉、甲状腺下静脉等的血液。</li></ul>
<p><strong>&lt;静脉角&gt;</strong></p>
<p><strong>&gt;&gt;&gt;&gt;&gt;定义：颈内静脉与锁骨下静脉汇合，形成头臂静脉的夹角处。</strong></p>
<p><strong>· 位置：位于胸锁关节的后方，左右各一个。</strong></p>
<p><strong>· 功能：是胸导管和右淋巴导管的注入部位。</strong></p>
<p><strong>&gt; 胸导管：全身约3/4的淋巴液最终通过胸导管注入左静脉角。</strong></p>
<p><strong>&gt; 右淋巴导管：身体右上1/4区域的淋巴液通过右淋巴导管注入右静脉角。</strong></p>
<p><strong>---------- 临床操作与风险：</strong></p>
<p><strong>· 中心静脉穿刺（如锁骨下静脉穿刺）在静脉角附近进行。</strong></p>
<p><strong>· 风险：穿刺不当可能引发气胸或误伤锁骨下动脉。</strong></p>
<ul><li>头颈部静脉 ：</li></ul>
<ul><li>颈内静脉：</li></ul>
<ul><li>走行：在颈静脉孔处续于乙状窦，于颈动脉鞘内沿颈内动脉下行，在胸锁关节后方与锁骨下静脉汇合成头臂静脉。</li></ul>
<ul><li>收集范围：</li></ul>
<ul><li>颅内属支：通过硬脑膜窦收集脑、脑膜等部位的静脉血。</li></ul>
<ul><li>颅外属支：收集咽、舌、甲状腺、面部和颈部的静脉血。部分直接注入，部分通过面静脉、下颌后静脉注入。</li></ul>
<ul><li>面静脉：</li></ul>
<ul><li>走行：起自内眦静脉，在面动脉后方下行，与下颌后静脉前支汇合后注入颈内静脉。</li></ul>
<ul><li>交通：通过内眦静脉、眼静脉与颅内海绵窦相通，且缺乏静脉瓣。</li></ul>
<ul><li>危险三角：鼻根至两侧口角的三角形区域。感染时挤压可能导致颅内感染。</li></ul>
<ul><li>下颌后静脉：</li></ul>
<ul><li>由颞浅静脉和上颌静脉在腮腺内汇合而成，分前、后两支。</li></ul>
<ul><li>前支汇入面静脉，后支参与合成颈外静脉。</li></ul>
<p>&gt;颈外静脉：</p>
<ul><li>走行：由下颌后静脉后支、耳后静脉、枕静脉等汇合而成，在胸锁乳突肌表面下行，注入锁骨下静脉。</li></ul>
<ul><li>临床：属于浅静脉，其怒张提示右心衰竭或上腔静脉压力增高。</li></ul>
<p>&gt;锁骨下静脉</p>
<p>腋静脉的延续，主要收集上肢、颈部浅层结构的静脉血</p>
<p><strong>·</strong> <strong>上肢静脉：</strong></p>
<ul><li>浅静脉：</li></ul>
<ul><li>头静脉：起自手背静脉网桡侧，经三角肌胸大肌间沟，穿深筋膜注入腋静脉或锁骨下静脉。</li></ul>
<ul><li>贵要静脉：起自手背静脉网尺侧，至臂中点平面穿深筋膜，注入肱静脉或腋静脉。</li></ul>
<ul><li>肘正中静脉：连接头静脉和贵要静脉，变异较多。</li></ul>
<ul><li>记忆口诀："挠头尺贵"——头静脉在桡侧，贵要静脉在尺侧。</li></ul>
<ul><li>深静脉：与同名动脉伴行，且多为两条。两条肱静脉汇合成一条腋静脉。</li></ul>
<p><strong>&lt;腋静脉&gt;</strong></p>
<p><strong>· 定义：上肢深静脉的主干，负责收集整个上肢（包括浅、深静脉）的血液回流。</strong></p>
<p><strong>· 位置与走行：位于腋窝内，在腋动脉的内侧与之伴行。其远端由两条肱静脉在大圆肌下缘汇合而成，近端在第一肋外缘延续为锁骨下静脉。</strong></p>
<p><strong>· 主要属支：</strong></p>
<p><strong>· 贵要静脉注入肱静脉，再注入腋静脉。</strong></p>
<p><strong>· 头静脉直接注入腋静脉。</strong></p>
<ul><li>胸部静脉 （要记）：</li></ul>
<ul><li>胸廓内静脉：由腹壁上静脉延续而成，注入头臂静脉。</li></ul>
<ul><li>奇静脉（要记） ：</li></ul>
<ul><li>由右腰升静脉穿过膈肌延续而成，注入上腔静脉。</li></ul>
<ul><li>收集右肋间后静脉、半奇静脉、食管静脉、支气管静脉的血液。</li></ul>
<ul><li>半奇静脉：由左腰升静脉穿过膈肌延续而成，注入奇静脉。</li></ul>
<ul><li>副半奇静脉：注入半奇静脉或奇静脉。</li></ul>
<p><strong>（二）下腔静脉系</strong></p>
<p>收集下肢、盆部、腹部的静脉血。</p>
<p>&gt;下腔静脉：</p>
<ul><li>由左、右髂总静脉在第5腰椎体右侧汇合而成。</li></ul>
<ul><li>沿腹主动脉右侧上行，穿膈肌腔静脉孔注入右心房。</li></ul>
<p>&gt;髂总静脉：由髂内静脉和髂外静脉在骶髂关节前方汇合而成。</p>
<p>&gt;髂外静脉：由股静脉经腹股沟韧带深面向上延续而成。</p>
<ul><li>腹前壁的静脉：</li></ul>
<p>&gt;浅静脉：</p>
<ul><li>胸腹壁静脉：汇入胸外侧静脉→腋静脉。</li></ul>
<ul><li>腹壁浅静脉：汇入大隐静脉。</li></ul>
<p>&gt;深静脉：</p>
<ul><li>腹壁上静脉：延续为胸廓内静脉→头臂静脉。</li></ul>
<ul><li>腹壁下静脉：注入髂外静脉。</li></ul>
<ul><li>腹腔成对脏器的静脉：</li></ul>
<ul><li>睾丸静脉（卵巢静脉）：</li></ul>
<ul><li>右侧以锐角注入下腔静脉。</li></ul>
<ul><li>左侧以直角注入左肾静脉（这是左侧精索静脉曲张多发的原因）。</li></ul>
<ul><li>肾静脉：经肾动脉前方横行注入下腔静脉。</li></ul>
<ul><li>肾上腺静脉：右侧注入下腔静脉，左侧注入左肾静脉。</li></ul>
<ul><li>腹腔不成对脏器的静脉：通过肝门静脉系统回流。</li></ul>
<ul><li>下肢的静脉：</li></ul>
<ul><li>深静脉：膝以下一条动脉有两条静脉伴行，至腘窝汇合成一条腘静脉，向上延续为股静脉，继而延续为髂外静脉。</li></ul>
<ul><li>浅静脉：</li></ul>
<p><strong>*· 大隐静脉：(重点)</strong>*</p>
<ul><li>走行：起自足背静脉弓内侧，经内踝前方，沿小腿、膝关节、大腿内侧上行，于耻骨结节外下方穿隐静脉裂孔，注入股静脉。</li></ul>
<ul><li>属支：注入前接收5条属支——旋髂浅静脉、腹壁浅静脉、阴部外静脉、股内侧浅静脉、股外侧浅静脉。</li></ul>
<ul><li>临床：是全身 <strong>*最长</strong>* 的浅静脉，下肢静脉曲张好发血管，也是输液常用血管。</li></ul>
<p><strong>*· 小隐静脉：（重点）</strong>*</p>
<ul><li>走行：起自足背静脉弓外侧，经外踝后方，沿小腿后面上行至腘窝，注入腘静脉。</li></ul>
<ul><li>记忆口诀："大（隐）（在）内小（隐）（在）外"。“大内小外”</li></ul>
<ul><li>盆部的静脉：</li></ul>
<ul><li>髂内静脉：</li></ul>
<ul><li>壁支：臀上、下静脉，闭孔静脉。</li></ul>
<ul><li>脏支：起自直肠静脉丛、阴部静脉丛、子宫阴道静脉丛。</li></ul>
<ul><li>直肠静脉丛：</li></ul>
<ul><li>上部经直肠上静脉→肠系膜下静脉。</li></ul>
<ul><li>下部经直肠下静脉→髂内静脉。</li></ul>
<ul><li>肛管经肛静脉→阴部内静脉→髂内静脉。</li></ul>
<p><strong>四、肝门静脉系（三星大重点）</strong></p>
<p>&lt;肝门静脉&gt;</p>
<ul><li>由肠系膜上静脉和脾静脉在胰头后方汇合而成，长6-8cm。</li></ul>
<ul><li>至肝门分左、右支入肝。</li></ul>
<ul><li>特点：</li></ul>
<ul><li>起止均为毛细血管（胃肠毛细血管→肝血窦）。</li></ul>
<ul><li>无功能性静脉瓣，故压力高时血液易逆流。</li></ul>
<ul><li>收集腹腔不成对脏器（食管腹段至直肠上部、脾、胰、胆囊）的静脉血。</li></ul>
<ul><li>主要属支（记忆口诀：上下左右皮（脾）蛋（胆）齐（脐））：</li></ul>
<ul><li>肠系膜上静脉（上）</li></ul>
<ul><li>肠系膜下静脉（下）</li></ul>
<ul><li>胃左静脉（左）</li></ul>
<ul><li>胃右静脉（右）</li></ul>
<ul><li>脾静脉（皮）（通常接收肠系膜下静脉）</li></ul>
<ul><li>胆囊静脉（蛋）</li></ul>
<ul><li>附脐静脉（齐）（左、右支，起自脐周静脉网）</li></ul>
<ul><li>门静脉高压与侧支循环：</li></ul>
<ul><li>当肝门静脉阻塞（如肝硬化），血流受阻，可通过以下侧支循环回心，导致相应病理改变：</li></ul>
<p>1. 食管静脉丛：</p>
<ul><li>路径：肝门静脉→胃左静脉→食管静脉丛→食管静脉→奇静脉→上腔静脉。</li></ul>
<ul><li>病理：食管胃底静脉曲张，破裂可致致命性大呕血。</li></ul>
<p>2. 直肠静脉丛：</p>
<ul><li>路径：肝门静脉→脾静脉→肠系膜下静脉→直肠上静脉→直肠静脉丛→直肠下静脉/肛静脉→髂内静脉→髂总静脉→下腔静脉。</li></ul>
<ul><li>病理：痔静脉曲张，形成"痔"。</li></ul>
<p>3. 脐周静脉网：</p>
<ul><li>路径：肝门静脉→附脐静脉→脐周静脉网→通过与腹壁上、下静脉，胸腹壁静脉，腹壁浅静脉等的交通，分别汇入上、下腔静脉。</li></ul>
<ul><li>病理：脐周腹壁静脉曲张，呈"海蛇头"征。</li></ul>
<p>4. Retzius静脉：肠系膜静脉与腹后壁静脉交通。</p>

<p><strong>第二部分：淋巴系统</strong></p>
<p>淋巴系统由淋巴管道、淋巴组织和淋巴器官组成。是静脉系统的辅助回流系统，并具有免疫防御功能。</p>
<p><strong>一、淋巴管道</strong></p>
<ul><li>毛细淋巴管：</li></ul>
<ul><li>以盲端起始于组织间隙，通透性大，可吸收蛋白质、细菌、癌细胞等。</li></ul>
<ul><li>分布广泛，但上皮、角膜、晶状体、软骨、脑和脊髓内无。</li></ul>
<ul><li>淋巴管：</li></ul>
<ul><li>结构与静脉相似，瓣膜丰富，呈串珠状。</li></ul>
<ul><li>分浅、深两种：浅淋巴管与浅静脉伴行，深淋巴管与深部血管神经伴行。</li></ul>
<ul><li>淋巴干：</li></ul>
<ul><li>共9条：左、右颈干，左、右锁骨下干，左、右支气管纵隔干，左、右腰干，1条肠干。</li></ul>
<ul><li>淋巴导管：</li></ul>
<ul><li>胸导管：</li></ul>
<ul><li>起始：起自乳糜池（由左、右腰干和肠干汇合），位于第1腰椎前方。</li></ul>
<ul><li>走行：经主动脉裂孔入胸腔，沿脊柱右前方上行，至第5胸椎高度转向左侧，出胸廓上口至颈根部。</li></ul>
<ul><li>注入：左静脉角。</li></ul>
<ul><li>收集范围：全身3/4区域的淋巴（左头颈、左上肢、左胸、腹部、双下肢、盆部）。</li></ul>
<ul><li>右淋巴导管：</li></ul>
<ul><li>由右颈干、右锁骨下干、右支气管纵隔干汇合而成。</li></ul>
<ul><li>注入：右静脉角。</li></ul>
<ul><li>收集范围：全身1/4区域的淋巴（右头颈、右上肢、右胸）。</li></ul>
<p><strong>二、淋巴器官与组织</strong></p>
<ul><li>淋巴结：</li></ul>
<ul><li>形态：圆形或椭圆形，一侧凸（输入淋巴管进入），一侧凹（淋巴结门，输出淋巴管及血管神经出入）。</li></ul>
<ul><li>功能：滤过淋巴、产生淋巴细胞、进行免疫应答。</li></ul>
<ul><li>局部淋巴结/前哨淋巴结：机体某区域或器官淋巴引流的第一站淋巴结。其肿大常提示该引流区域存在病变。</li></ul>
<ul><li>脾：</li></ul>
<ul><li>人体最大的淋巴器官。</li></ul>
<ul><li>位置：位于左季肋区，与第9～11肋相对，长轴与第10肋一致。</li></ul>
<ul><li>结构：分膈面、脏面，脏面有脾门，上缘有2～3个脾切迹，为触诊标志。</li></ul>
<ul><li>功能：储血、造血、清除衰老红细胞、免疫应答。</li></ul>
<ul><li>副脾：出现率为10%～40%，脾切除时需一并切除。</li></ul>
<p><strong>三、全身各部的主要淋巴结</strong></p>
<ul><li>头颈部的淋巴结：</li></ul>
<ul><li>颈外侧深淋巴结：</li></ul>
<ul><li>其上部的淋巴结位于鼻咽部和舌根后方，是鼻咽癌或舌根癌的常见转移部位。</li></ul>
<ul><li>其下部的淋巴结延伸至锁骨上方，称为锁骨上淋巴结。</li></ul>
<ul><li>左锁骨上淋巴结（Virchow淋巴结）肿大，常提示胃癌或食管癌经胸导管逆行转移。</li></ul>
<ul><li>上肢的淋巴结：</li></ul>
<ul><li>腋淋巴结：</li></ul>
<ul><li>位于腋窝疏松结缔组织内，约15-20个，沿血管排列。</li></ul>
<ul><li>分五群：胸肌淋巴结、外侧淋巴结、肩胛下淋巴结、中央淋巴结、尖淋巴结。</li></ul>
<ul><li>收集范围：胸前外侧壁、肩背部及上肢的浅、深淋巴管。</li></ul>
<ul><li>输出管汇合成锁骨下干。</li></ul>
<p><strong>四、临床应用</strong></p>
<ul><li>淋巴水肿：淋巴回流受阻，导致富含蛋白质的淋巴液在组织间隙积聚，引发水肿（如丝虫病导致的"象皮肿"）。</li></ul>
<ul><li>淋巴结检查：</li></ul>
<ul><li>顺序：耳前 → 耳后 → 枕部 → 下颌下 → 颏下 → 颈前 → 颈后 → 锁骨上窝 → 腋窝 → 滑车上 → 腹股沟。</li></ul>
<ul><li>腋窝淋巴结分群（5群）：胸肌群、外侧群、肩胛下群、中央群、尖群。</li></ul>
<ul><li>描述要点：部位、大小、数目、质地、活动度、有无压痛、与周围组织关系。</li></ul>
<ul><li>Virchow淋巴结（左锁骨上淋巴结）：肿大时，常提示腹腔（尤其胃、食管）癌细胞转移（经胸导管逆行转移）。</li></ul>
<hr>
<p><strong>第三部分：感觉器 - 视器</strong></p>
<p>视器由眼球和眼副器组成。</p>
<h3>一、眼球壁（三层）</h3>
<p>1. <strong>外膜（纤维膜）</strong> ：保护眼球。</p>
<ul><li>角膜 ：前1/6，无色透明，无血管，富含神经末梢，屈光作用强。感觉敏锐，有角膜反射（眨眼）。</li></ul>
<ul><li>巩膜 ：后5/6，乳白色，不透明。与角膜交界处深面有环形巩膜静脉窦，是房水回流的通道。</li></ul>
<p>2. <strong>中膜（血管膜/葡萄膜）</strong> ：富含血管和色素。</p>
<ul><li>虹膜 ：中央有瞳孔。内含两种平滑肌：</li></ul>
<ul><li>瞳孔括约肌 （环行）：副交感神经支配，缩瞳。</li></ul>
<ul><li>瞳孔开大肌 （放射状）：交感神经支配，散瞳。</li></ul>
<ul><li>瞳孔对光反射：强光下瞳孔缩小。</li></ul>
<ul><li>睫状体 ：</li></ul>
<ul><li>功能：产生房水；内含睫状肌（副交感支配），通过收缩舒张调节晶状体曲度。</li></ul>
<ul><li>脉络膜：占后2/3，营养眼内组织，吸收光线，防止扰乱视觉。</li></ul>
<p>3. <strong>内膜（视网膜）</strong> ：</p>
<ul><li>分层：外层为色素上皮层，内层为神经层。两层间易分离，称视网膜剥离。</li></ul>
<ul><li>分部：</li></ul>
<ul><li>视网膜盲部 （虹膜部、睫状体部）：无感光细胞。</li></ul>
<ul><li>视网膜视部 （脉络膜部）：有感光细胞。</li></ul>
<ul><li>重要结构：</li></ul>
<ul><li>视神经盘（视神经乳头）：视网膜神经纤维汇集处，形成视神经穿出眼球。无感光细胞，为生理性盲点。</li></ul>
<ul><li>黄斑：视神经盘颞侧稍下方，为感光最敏锐处。其中央凹陷称中央凹。</li></ul>
<ul><li>感光细胞（追强赶弱）：</li></ul>
<ul><li>视锥细胞：感受强光和颜色（口诀：追强）。</li></ul>
<ul><li>视杆细胞：感受弱光（口诀：赶弱）。缺乏维生素A可导致夜盲症。</li></ul>
<h3>二、眼球内容物（眼的屈光系统）</h3>
<p>1. 房水：</p>
<ul><li>循环途径：睫状体产生 → 后房 → 瞳孔 → 前房 → 虹膜角膜角 → 巩膜静脉窦 → 眼静脉。</li></ul>
<ul><li>功能：营养角膜、晶状体，维持眼内压。</li></ul>
<ul><li>临床：房水循环受阻 → 眼压升高 → 青光眼。</li></ul>
<p>2. 晶状体：</p>
<ul><li>双凸透镜状，透明，有弹性，无血管神经。</li></ul>
<ul><li>功能：屈光、调节焦距。</li></ul>
<ul><li>临床：混浊 → 白内障。随年龄增长，弹性减退 → 老视（老花眼）。</li></ul>
<p>3. 玻璃体：无色透明的胶状物质，支撑视网膜。混浊可致视力障碍。</p>
<h3>三、眼副器</h3>
<p>包括眼睑、结膜、泪器、眼球外肌等，对眼球起支持、保护和运动作用。</p>
<ul><li>眼睑：</li></ul>
<ul><li>分皮肤、皮下组织、肌层、睑板、结膜五层。</li></ul>
<ul><li><strong>睑板腺阻塞</strong> 形成霰粒肿， <strong>睫毛毛囊感染</strong> 形成麦粒肿。</li></ul>
<ul><li>结膜：覆盖于眼睑内面和眼球前面的薄膜。发炎称结膜炎。</li></ul>
<h3>四、视力与屈光不正</h3>
<ul><li>屈光不正类型：近视、远视、散光。</li></ul>
<ul><li>色盲：多为X连锁隐性遗传，常见为红绿色盲。</li></ul>
<p>视器</p>
<p>1. 结膜</p>
<ul><li>定义：一层薄而透明、富含血管的黏膜，覆盖于眼球前面和眼睑内面。</li></ul>
<ul><li>分部：</li></ul>
<ul><li>睑结膜：覆盖于上、下睑内面，与睑板紧密相连。</li></ul>
<ul><li>球结膜：覆盖于巩膜前面，于角膜缘移行为角膜上皮。与巩膜连接疏松，故易发生球结膜下水肿与出血。</li></ul>
<ul><li>结膜穹隆：睑结膜与球结膜相互移行返折处，分为结膜上穹和结膜下穹。</li></ul>
<ul><li>结膜囊：当上下睑闭合时，整个结膜围成的囊状腔隙，通过睑裂与外界相通。</li></ul>
<p>2. 泪器</p>
<ul><li>组成：包括分泌泪液的泪腺和排泄泪液的泪道。</li></ul>
<ul><li>泪腺：</li></ul>
<ul><li>位置：位于眶上壁外侧部的泪腺窝内。</li></ul>
<ul><li>功能：分泌泪液，排泄管开口于结膜上穹。泪液可冲洗结膜囊、湿润角膜、抑制细菌。</li></ul>
<ul><li>泪道：</li></ul>
<ul><li>泪点：位于上下睑缘内侧端的泪乳头中央，是泪小管的入口。</li></ul>
<ul><li>泪小管：连接泪点与泪囊，最初垂直上行/下行，继而水平转向内侧汇合，开口于泪囊。</li></ul>
<ul><li>泪囊：位于泪囊窝内的膜性囊，上端为盲端，下端移行为鼻泪管。</li></ul>
<ul><li>鼻泪管：膜性管道，上部包埋于骨性鼻泪管，下部在鼻腔外侧壁黏膜内，开口于下鼻道外侧壁。</li></ul>
<p>3. 眼球外肌</p>
<ul><li>组成：包括运动眼球的4块直肌、2块斜肌和运动眼睑的1块上睑提肌。</li></ul>
<ul><li>各肌功能：</li></ul>
<ul><li>上直肌：使瞳孔转向上内。</li></ul>
<ul><li>下直肌：使瞳孔转向下内。</li></ul>
<ul><li>内直肌：使瞳孔转向内侧。</li></ul>
<ul><li>外直肌：使瞳孔转向外侧。</li></ul>
<ul><li>上斜肌：经滑车后，使瞳孔转向下外。</li></ul>
<ul><li>下斜肌：使瞳孔转向上外。</li></ul>
<ul><li>上睑提肌：上提上睑，开大睑裂。</li></ul>
<ul><li>神经支配（复习口诀）：</li></ul>
<ul><li>动眼神经：上睑提肌、上直肌、下直肌、内直肌、下斜肌（上上下下内）。</li></ul>
<ul><li>滑车神经：上斜肌（上斜滑）。</li></ul>
<ul><li>展神经：外直肌（外展外）。</li></ul>
<ul><li>临床联系：眼球的运动需双眼肌肉协同完成。某一肌肉瘫痪会导致作用力不平衡，引起斜视或复视。</li></ul>
<p>4. 眼的血管</p>
<p><strong>· 动脉：</strong></p>
<ul><li>主要来自眼动脉（颈内动脉分支）。</li></ul>
<ul><li>视网膜中央动脉：为眼动脉重要分支，在视神经盘处分为视网膜鼻侧上/下、颞侧上/下小动脉，营养视网膜内层。是终动脉，无吻合支，一旦阻塞可导致眼全盲。临床可用眼底镜观察。</li></ul>
<p><strong>· 静脉：</strong></p>
<ul><li>主要有眼上、下静脉，向后注入海绵窦。</li></ul>
<ul><li>特点：无瓣膜，向前与面静脉吻合。故面部感染可经眼静脉蔓延至海绵窦，引起颅内感染。</li></ul>
<p>前庭蜗器</p>
<p><strong>1. 外耳</strong></p>
<p><strong>· 耳郭：</strong></p>
<ul><li>结构：以弹性软骨为支架，外覆皮肤。下方无软骨部分为耳垂，是临床常用采血部位。</li></ul>
<ul><li>功能：收集声波。</li></ul>
<ul><li>重要标志：耳轮、对耳轮、耳舟、耳甲（分为耳甲艇和耳甲腔）、耳屏、对耳屏等。这些是耳穴定位的标志。</li></ul>
<p><strong>· 外耳道：</strong></p>
<ul><li>走行：自外耳门至鼓膜，成人长约2.5cm。外侧1/3为软骨部，内侧2/3为骨部。</li></ul>
<ul><li>特点：整体呈“S”形弯曲（软骨部向后内上，骨部向前内下）。检查时需将耳郭向后上牵拉使管腔变直。婴儿外耳道短而直，检查时需将耳郭向后下牵拉。</li></ul>
<ul><li>皮肤：薄，与软骨膜、骨膜紧贴，富含感觉神经末梢，故疖肿时剧痛。含有耵聍腺，分泌耵聍（耳屎）。</li></ul>
<p><strong>· 鼓膜：</strong></p>
<ul><li>位置与形态：位于外耳道与鼓室之间，椭圆形半透明薄膜，向前外下倾斜约45°。</li></ul>
<ul><li>分部：</li></ul>
<ul><li>松弛部：上1/4，薄而红。</li></ul>
<ul><li>紧张部：下3/4，坚而白。</li></ul>
<ul><li>结构：中心向内凹陷为鼓膜脐，其前下方有光锥。</li></ul>
<p><strong>2. 中耳</strong></p>
<p><strong>· 鼓室：</strong></p>
<ul><li>位置与交通：颞骨岩部内含气的不规则小腔。向前借咽鼓管通鼻咽部，向后借乳突窦通乳突小房，向内借前庭窗和蜗窗通内耳。</li></ul>
<p>&gt;&gt;&gt;鼓室的六壁：</p>
<ul><li>上壁（盖壁）：与颅中窝相隔。</li></ul>
<ul><li>下壁（颈静脉壁）：与颈内静脉起始部相隔。</li></ul>
<ul><li>前壁（颈动脉壁）：与颈内动脉相隔。</li></ul>
<ul><li>后壁（乳突壁）：上部有乳突窦入口。</li></ul>
<ul><li>外侧壁（鼓膜壁）：主要由鼓膜构成。</li></ul>
<ul><li>内侧壁（迷路壁）：即内耳外侧壁。中部隆起为岬；岬后上方有前庭窗（被镫骨底封闭）；岬后下方有蜗窗（被第二鼓膜封闭）；前庭窗后上方有面神经管凸（内有面神经通过，中耳炎或手术易损伤）。</li></ul>
<p>&gt;&gt;&gt;鼓室的内容物：听小骨链（锤骨、砧骨、镫骨）。声波振动鼓膜，通过听骨链杠杆系统，使镫骨底在前庭窗摆动，将振动传入内耳。</p>
<ul><li>咽鼓管：</li></ul>
<ul><li>功能：维持鼓室与外界气压平衡。</li></ul>
<ul><li>分部：外侧1/3为骨部，内侧2/3为软骨部。</li></ul>
<ul><li>特点：平时咽口关闭，张口、吞咽时开放。婴幼儿咽鼓管短、宽、平，故咽部感染易蔓延至中耳，引起中耳炎。</li></ul>
<ul><li>乳突窦和乳突小房：</li></ul>
<ul><li>鼓室向后的延伸，腔内覆有黏膜并与鼓室黏膜相延续。</li></ul>
<ul><li>临床联系：中耳炎可蔓延至乳突，引起乳突炎。</li></ul>
<p><strong>3. 内耳（迷路）</strong></p>
<ul><li>骨迷路（骨性隧道）：</li></ul>
<ul><li>前庭：中部，近似椭圆形腔隙。外侧壁有前庭窗和蜗窗。</li></ul>
<ul><li>骨半规管：三个（前、后、外），互相垂直。每个有单骨脚和膨大的骨壶腹。前、后骨半规管的单骨脚合成一个总骨脚。</li></ul>
<ul><li><strong>耳蜗</strong> ：形似蜗牛壳，由蜗螺旋管绕 蜗轴 旋转两圈半构成。蜗轴发出的 骨螺旋板 将蜗螺旋管不完全分隔，由上而下分为前庭阶（通前庭窗）、膜蜗管（含内淋巴）和鼓阶（通蜗窗）。前庭阶与鼓阶在蜗顶借蜗孔相通。</li></ul>
<ul><li>膜迷路（套在骨迷路内的膜性管囊，含内淋巴）：</li></ul>
<ul><li>椭圆囊和球囊：位于前庭内。囊壁分别有椭圆囊斑和球囊斑，能感受头部静止位置和直线变速运动的刺激。</li></ul>
<ul><li>膜半规管：位于骨半规管内。膜壶腹壁上有壶腹嵴，能感受头部旋转变速运动的刺激。</li></ul>
<ul><li>蜗管：位于耳蜗内。横断面呈三角形。</li></ul>
<ul><li>上壁：前庭膜。</li></ul>
<ul><li>下壁（基底膜）：上有螺旋器，是听觉感受器。由支持细胞和毛细胞组成，上方有盖膜。</li></ul>
<ul><li>声波传导途径：</li></ul>
<ul><li>空气传导（主要途径）：</li></ul>
<ul><li>正常途径：声波 → 外耳道 → 鼓膜振动 → 听小骨链（放大）→ 前庭窗 → 前庭阶外淋巴 → 前庭膜 → 蜗管内淋巴 → 基底膜上的螺旋器兴奋 → 产生神经冲动。</li></ul>
<ul><li>鼓膜穿孔时的代偿途径：声波 → 外耳道 → 鼓室空气振动 → 蜗窗（第二鼓膜）→ 鼓阶外淋巴 → 基底膜 → 螺旋器。</li></ul>
<ul><li>骨传导：声波经颅骨 → 骨迷路 → 内耳淋巴。正常情况下作用微弱，但对鉴别耳聋类型有重要临床意义。</li></ul>
<ul><li>耳聋分类：</li></ul>
<ul><li>传导性耳聋：外耳或中耳病变，使空气传导受阻，但骨传导正常或增强。</li></ul>
<ul><li>神经性耳聋：内耳螺旋器、蜗神经或听觉中枢病变，空气和骨传导均受阻。</li></ul>
<p><strong>神经系统概述</strong></p>
<p>1. 定义与功能</p>
<ul><li>定义：由脑、脊髓以及与其相连的脑神经和脊神经组成。</li></ul>
<ul><li>功能：</li></ul>
<ul><li>调控与整合：控制和调节其他所有系统的活动，使机体成为一个统一的整体（如运动时协调呼吸、心跳）。</li></ul>
<ul><li>适应环境：维持机体内外环境的平衡（如体温调节）。</li></ul>
<ul><li>高级功能：人类神经系统高度发展，产生了语言、思维，使我们能主动认识和改造世界。</li></ul>
<p>2. 区分（分类）</p>
<ul><li>按位置和功能：</li></ul>
<ul><li>中枢神经系统 (CNS)：包括脑和脊髓，是调节功能的主导中心。</li></ul>
<ul><li>周围神经系统 (PNS)：包括与脑相连的12对脑神经和与脊髓相连的31对脊神经。</li></ul>
<ul><li>按分布对象和功能：</li></ul>
<ul><li>躯体神经：分布于皮肤和运动系统。含躯体感觉（传导皮肤、运动系统的感觉）和躯体运动（支配骨骼肌运动）。</li></ul>
<ul><li>内脏神经（自主神经系统）：分布于内脏、心血管和腺体。含内脏感觉和内脏运动。内脏运动神经又分为：</li></ul>
<ul><li>交感神经</li></ul>
<ul><li>副交感神经</li></ul>
<p>3. 基本组织</p>
<ul><li>神经元</li></ul>
<ul><li>结构与功能：是神经系统结构和功能的基本单位，负责感受刺激、整合信息和传导冲动。高度分化，通常不再分裂。</li></ul>
<ul><li>结构：</li></ul>
<ul><li>胞体：代谢中心，含尼氏体（核糖体，合成蛋白质）和神经原纤维。无中心体。</li></ul>
<ul><li>突起：</li></ul>
<ul><li>树突：短而分支多，接受冲动。</li></ul>
<ul><li>轴突：长，通常一条，传导冲动离开胞体。</li></ul>
<ul><li>分类：</li></ul>
<ul><li>按突起数量：假单极神经元（脊神经节）、双极神经元（视网膜、嗅黏膜）、多极神经元（CNS内最多）。</li></ul>
<ul><li>按功能：感觉神经元（传入）、运动神经元（传出）、联络神经元（中间神经元，占99%）。</li></ul>
<ul><li>神经胶质细胞</li></ul>
<ul><li>功能：对神经元起支持、营养、保护、绝缘和修复作用。具有增殖能力。</li></ul>
<ul><li>类型：星形胶质细胞、少突胶质细胞（CNS髓鞘）、小胶质细胞、室管膜细胞、施万细胞（PNS髓鞘）。</li></ul>
<p>4. <strong>常用术语</strong></p>
<ul><li>中枢神经系统内 ：</li></ul>
<ul><li><strong>灰质</strong> ：神经元胞体和树突聚集处，色泽灰暗。 大脑和小脑表层的灰质称为 <strong>皮质</strong> 。</li></ul>
<ul><li><strong>白质</strong> ：神经元轴突（多具髓鞘）聚集处，色泽亮白。 大脑和小脑深部的白质称为 <strong>髓质</strong> 。</li></ul>
<ul><li>神经核：形态和功能相似的神经元胞体在中枢内聚集成的团或柱。</li></ul>
<ul><li>纤维束（传导束）：起止、行程和功能相同的神经纤维在中枢内集合成束。</li></ul>
<ul><li>周围神经系统内：</li></ul>
<ul><li>神经节：神经元胞体在周围部聚集的地方，外形膨大（如脊神经节）。</li></ul>
<ul><li>神经：神经纤维在周围部集合成束，由结缔组织（神经内膜、束膜、外膜）包裹。</li></ul>
<p>5. 神经系统的活动方式：反射</p>
<ul><li>反射：神经系统调节机体活动的基本方式。</li></ul>
<ul><li>反射弧：反射的形态学基础，包括五个部分：</li></ul>
<ul><li>感受器 → 传入神经 → 神经中枢 → 传出神经 → 效应器</li></ul>
<hr>
<h2>第二部分：脊髓</h2>
<p>1. 位置与外形</p>
<ul><li>位置：位于椎管内，上端在枕骨大孔处与延髓相连。</li></ul>
<ul><li>下端：</li></ul>
<ul><li>成人：平第1腰椎体下缘。</li></ul>
<ul><li>新生儿：平第3腰椎。</li></ul>
<ul><li>临床意义：故临床常在第3-4或第4-5腰椎间进行腰椎穿刺（腰穿/腰麻），以避免损伤脊髓。</li></ul>
<ul><li>外形：</li></ul>
<ul><li><strong>两个膨大</strong> ：颈膨大 (C4-T1) - 与上肢神经支配有关；腰骶膨大 (L2-S3) - 与下肢神经支配有关。</li></ul>
<ul><li>脊髓圆锥：腰骶膨大以下变细的部分。</li></ul>
<ul><li>终丝：由软脊膜形成，无神经组织，固定脊髓。</li></ul>
<ul><li>六条沟裂：前正中裂（深）、后正中沟（浅）、前外侧沟（前根出处）、后外侧沟（后根进入处）。</li></ul>
<ul><li>脊髓节段：与每一对脊神经相连的一段脊髓为一个节段，共31个（C1-8, T1-12, L1-5, S1-5, Co1）。</li></ul>
<ul><li>马尾：因脊髓短于脊柱，腰、骶、尾段的神经根在椎管内垂直下行，环绕终丝，形成马尾。</li></ul>
<p>2. 内部结构（横断面）</p>
<ul><li>中央管：位于中心，内含脑脊液。</li></ul>
<ul><li><strong>灰质</strong> ：呈“H”形或蝴蝶形，围绕中央管。</li></ul>
<ul><li>前角（前柱）：含躯体运动神经元的胞体，发出纤维支配骨骼肌。</li></ul>
<ul><li>后角（后柱）：与感觉传导有关，主要接受脊神经节传来的感觉冲动。</li></ul>
<ul><li>侧角（中间带）：见于T1-L3节段，含交感神经元胞体；S2-4节段有副交感神经元胞体。</li></ul>
<ul><li>灰质联合：连接两侧灰质。</li></ul>
<p class="note-img"><img src="anatomy-images/img-21.jpg" loading="lazy" alt="解剖图 21"></p>
<ul><li><strong>白质</strong> ：位于灰质周围，借沟裂分为三索。</li></ul>
<ul><li>前索：前正中裂与前外侧沟之间。</li></ul>
<ul><li>外侧索：前、后外侧沟之间。</li></ul>
<ul><li>后索：后外侧沟与后正中沟之间。</li></ul>
<ul><li>白质内的主要纤维束：</li></ul>
<ul><li>上行（感觉）传导束：</li></ul>
<ul><li>薄束、楔束：位于后索。传导同侧的意识性本体感觉（位置觉、运动觉、震动觉）和精细触觉。薄束（T5以下）、楔束（T4以上）。</li></ul>
<p class="note-img"><img src="anatomy-images/img-22.jpg" loading="lazy" alt="解剖图 22"></p>
<ul><li>脊髓丘脑束：位于外侧索和前索。传导对侧的痛温觉（侧束） 和粗触觉、压觉（前束）。</li></ul>
<ul><li>脊髓小脑束：传导非意识性本体感觉至小脑，调节姿势和运动。</li></ul>
<p class="note-img"><img src="anatomy-images/img-23.jpg" loading="lazy" alt="解剖图 23"></p>
<ul><li>下行（运动）传导束：</li></ul>
<ul><li>皮质脊髓束：最大的运动传导束。管理躯干、四肢的随意运动。</li></ul>
<ul><li>皮质脊髓侧束：在延髓交叉后下行于外侧索，支配四肢肌。</li></ul>
<ul><li>皮质脊髓前束：不交叉，下行于前索，支配躯干肌。</li></ul>
<ul><li>红核脊髓束：兴奋屈肌，抑制伸肌。</li></ul>
<ul><li>前庭脊髓束：兴奋伸肌，抑制屈肌，维持身体平衡。</li></ul>
<ul><li>网状脊髓束：调节肌张力。</li></ul>
<p class="note-img"><img src="anatomy-images/img-24.jpg" loading="lazy" alt="解剖图 24"></p>
<p>3. 脊髓的功能</p>
<ul><li>传导功能：通过上下行纤维束连接脑与躯干四肢。</li></ul>
<ul><li>反射功能：</li></ul>
<ul><li>躯体反射：</li></ul>
<ul><li>浅反射：刺激皮肤、黏膜引起（如腹壁反射、提睾反射）。</li></ul>
<p class="note-img"><img src="anatomy-images/img-25.jpg" loading="lazy" alt="解剖图 25"></p>
<ul><li>深反射（牵张反射）：刺激肌、腱引起（如膝跳反射、跟腱反射）。肌张力的维持也属于牵张反射。</li></ul>
<p class="note-img"><img src="anatomy-images/img-26.jpg" loading="lazy" alt="解剖图 26"></p>
<ul><li>内脏反射：脊髓内有排尿、排便、血管舒缩等低级反射中枢。</li></ul>
<hr>
<h2>第三部分：脊神经</h2>
<p>1. 概述</p>
<ul><li>数量：31对（C1-8, T1-12, L1-5, S1-5, Co1）。</li></ul>
<ul><li>性质：都是混合性神经，含有躯体感觉、内脏感觉、躯体运动、内脏运动四种纤维成分。</li></ul>
<ul><li>分支：出椎间孔后分为：</li></ul>
<ul><li>前支：粗大，相互交织成神经丛（颈丛、臂丛、腰丛、骶丛），分布于躯干前外侧和四肢。</li></ul>
<ul><li>后支：较细，分布项、背、腰骶部深层肌和皮肤。</li></ul>
<ul><li>脊膜支：返回椎管，分布于脊髓被膜。</li></ul>
<ul><li>交通支：连接脊神经与交感干。</li></ul>
<p>2. （一） <strong>重要神经丛示例：颈丛</strong></p>
<ul><li>组成：C1-C4前支。</li></ul>
<ul><li>位置：胸锁乳突肌上部的深面。</li></ul>
<ul><li>主要分支与功能：</li></ul>
<ul><li>皮支（浅支）：从胸锁乳突肌后缘中点附近穿出，放射状分布，管理头颈侧面、肩部皮肤感觉。包括：</li></ul>
<ul><li>枕小神经</li></ul>
<ul><li>耳大神经</li></ul>
<ul><li>颈横神经</li></ul>
<ul><li>锁骨上神经</li></ul>
<ul><li>肌支（深支）：支配颈深部肌肉。</li></ul>
<ul><li><strong>最重要分支：膈神经</strong> ：</li></ul>
<ul><li>走行：经前斜角肌前面下行，穿胸廓上口入胸腔，越过肺根前方，沿心包两侧至膈。</li></ul>
<ul><li>功能：</li></ul>
<ul><li>运动纤维：支配膈肌运动。</li></ul>
<ul><li>感觉纤维：分布至胸膜、心包、膈下中央部腹膜（右侧还至肝、胆囊）。</li></ul>
<ul><li>损伤：同侧膈肌瘫痪，腹式呼吸减弱或消失，严重有窒息感。</li></ul>
<p>臂丛神经（C5–C8, T1前支）</p>
<p>位置：穿斜角肌间隙，绕锁骨下动脉后上方，经锁骨后方入腋窝，围绕腋动脉走行。</p>
<p>组成：分为锁骨上部和锁骨下部，锁骨下部形成内侧束、外侧束、后束。</p>
<p>主要分支及支配：</p>
<p>1. 胸长神经（C5–C7）</p>
<p>→ 支配前锯肌</p>
<p>→ 损伤表现：翼状肩胛</p>
<p>2. 胸背神经（C6-C8）</p>
<p>→ 支配背阔肌</p>
<p>→ 乳腺癌根治术易损伤</p>
<p>3. 腋神经（C5–C6，后束发出）</p>
<p>→ 支配三角肌、小圆肌</p>
<p>→ 皮支：肩部及臂外侧上部皮肤</p>
<p>→ 损伤：三角肌瘫痪 → 上肢外展障碍，肩部呈“方肩”</p>
<p>→ 常见损伤原因：肱骨外科颈骨折、腋杖压迫、肩关节脱位</p>
<p>4. 肌皮神经（外侧束发出）</p>
<p>→ 支配肱二头肌、喙肱肌、肱肌</p>
<p>→ 皮支：前臂外侧皮神经</p>
<p>5. 正中神经（内、外侧束汇合）</p>
<p>→ 走行：沿肱二头肌内侧沟下行，经肘窝、前臂正中、腕管入手掌</p>
<p>→ 支配：除肱桡肌、尺侧腕屈肌、指深屈肌尺侧半以外的前臂前群肌；鱼际肌（除拇收肌）、第1–2蚓状肌</p>
<p>→ 皮支：手掌桡侧2/3、桡侧3个半指掌面及中远节指背皮肤</p>
<p>→ 损伤：“猿手”（鱼际萎缩、拇指对掌障碍），前臂不能旋前，屈腕屈指无力</p>
<p>6. 尺神经（内侧束发出）</p>
<p>→ 走行：经肱骨内上髁后方尺神经沟，沿尺侧下行至豌豆骨外侧入手掌</p>
<p>→ 支配：尺侧腕屈肌、指深屈肌尺侧半、手肌内侧大部分（小鱼际肌、骨间肌、第3–4蚓状肌、拇收肌）</p>
<p>→ 皮支：手掌尺侧1/3、尺侧1个半指皮肤；手背尺侧1/2及2个半指皮肤</p>
<p>→ 损伤：“爪形手”（第4–5指掌指关节过伸、指间关节屈曲），小鱼际平坦，感觉障碍以手内侧缘为主</p>
<p>7. 桡神经（后束发出）</p>
<p>→ 走行：沿肱骨桡神经沟向外下，至肱骨外上髁前方分浅、深支</p>
<p>→ 支配：肱三头肌、肘肌、前臂后群肌（全部伸肌）</p>
<p>→ 皮支：臂后皮神经、臂外侧下皮神经、前臂后皮神经；手背桡侧半及桡侧2个半指近节指背</p>
<p>→ 损伤：“垂腕”（不能伸腕伸指），感觉障碍以手背第1–2掌骨间皮肤最明显</p>
<p>→ 口诀：“ <strong>桡神经不难记，全部伸肌肱桡肌；尺神经也简单，前臂屈肌一块办，名为尺侧腕屈肌</strong> ”</p>
<p>8. 其他分支：</p>
<ul><li>臂内侧皮神经</li></ul>
<ul><li>前臂内侧皮神经</li></ul>
<p class="note-img"><img src="anatomy-images/img-27.jpg" loading="lazy" alt="解剖图 27"></p>
<hr>
<p>（三）胸神经前支（12对）</p>
<ul><li>T1 大部分加入臂丛，T12 小部分加入腰丛</li></ul>
<ul><li>T1–T11：肋间神经，走行于肋间隙，排列顺序（自上而下）：静脉、动脉、神经</li></ul>
<ul><li>T12：肋下神经</li></ul>
<ul><li>阶段性分布口诀：</li></ul>
<p>二平胸骨角（T2）</p>
<p>四对乳头平（T4，男性）</p>
<p>六对到剑突（T6）</p>
<p>八对斜行肋弓下（T8）</p>
<p>十对肚脐水平处（T10）</p>
<p>十二肋下走得远，分布两侧腹股沟（T12）</p>
<hr>
<p>（四）腰丛（T12部分 + L1–L4前支）</p>
<p>位置：腰大肌深面，腰椎横突前方</p>
<p>主要分支：</p>
<p>1. 髂腹下神经</p>
<p>→ 支配腹壁肌，皮支分布于臀外侧及下腹部皮肤</p>
<p>2. 髂腹股沟神经</p>
<p>→ 支配腹壁肌，皮支分布于腹股沟区、阴囊/大阴唇皮肤</p>
<p>→ 腹股沟疝修补时需保护</p>
<p>3. 股外侧皮神经</p>
<p>→ 分布于大腿前外侧皮肤</p>
<p>4. 股神经（腰丛最大分支）</p>
<p>→ 经腹股沟韧带深面、股动脉外侧进入股三角</p>
<p>→ 支配：大腿前群肌（股四头肌）</p>
<p>→ 皮支：大腿前面、小腿内侧面及足内侧缘皮肤（隐神经）</p>
<p>→ 损伤：股四头肌瘫痪 → 伸膝无力，行走困难，膝跳反射消失</p>
<p>5. 闭孔神经</p>
<p>→ 穿闭膜管出盆腔</p>
<p>→ 支配大腿内收肌群，皮支分布于大腿内侧皮肤</p>
<p>→ 损伤：大腿内收障碍</p>
<hr>
<p>（五）骶丛（L4–L5, S1–S5, Co）</p>
<p>位置：盆腔后壁，骶骨与梨状肌前方</p>
<p>主要分支：</p>
<p>1. 臀上神经（梨状肌上孔出盆腔）→ 支配臀中肌、臀小肌</p>
<p>2. 臀下神经（梨状肌下孔出盆腔）→ 支配臀大肌</p>
<p>3. 股后皮神经 → 分布于大腿后方皮肤</p>
<p>4. 阴部神经（伴阴部内血管）</p>
<p>→ 经坐骨小孔入坐骨肛门窝</p>
<p>→ 分支：肛神经、会阴神经、阴茎/阴蒂背神经</p>
<p>→ 支配会阴部肌与皮肤</p>
<p>5. 坐骨神经（全身 <strong>最大最长</strong> 的神经）</p>
<p>→ 经梨状肌下孔出盆腔，于股骨大转子与坐骨结节之间下行</p>
<p>→ 体表投影：坐骨结节与大转子连线中点稍内侧 → 股骨内、外侧髁连线中点（上2/3段）</p>
<p>→ 分支：</p>
<ul><li>胫神经 → 小腿后群肌、足底肌；损伤呈“钩状足”</li></ul>
<ul><li>腓总神经 → 绕腓骨颈分为腓浅、腓深神经</li></ul>
<p>→ 损伤：“马蹄内翻足”、跨阈步态，感觉障碍以小腿前外侧面及足背明显</p>
<hr>
<p>（五）常见脊神经损伤口诀（上肢）</p>
<ul><li>桡神经伤 → 垂腕</li></ul>
<ul><li>尺神经伤 → 爪形手</li></ul>
<ul><li>正中神经伤 → 猿手</li></ul>
<ul><li>腋神经伤 → 方肩</li></ul>
<p class="note-img"><img src="anatomy-images/img-28.jpg" loading="lazy" alt="解剖图 28"></p>
<p class="note-img"><img src="anatomy-images/img-29.jpg" loading="lazy" alt="解剖图 29"></p>
<hr>
<hr>
<p>脑与脑神经</p>
<p>（一）脑的组成</p>
<p>脑位于颅腔内，成人平均重约1400g。由6部分组成：</p>
<p>1. 端脑（大脑）</p>
<p>2. 间脑</p>
<p>3. 小脑</p>
<p>4. 中脑</p>
<p>5. 脑桥</p>
<p>6. 延髓</p>
<ul><li>脑干 = 中脑 + 脑桥 + 延髓。</li></ul>
<hr>
<p>（二）脑干</p>
<p>位置： 位于颅后窝斜坡，下续脊髓，上接间脑。</p>
<p>1. 脑干外形（腹侧面 &amp; 背侧面）</p>
<ul><li>腹侧面：</li></ul>
<ul><li>延髓： 前正中裂两侧有锥体（内含锥体束），下端有锥体交叉。锥体外侧有橄榄（内含下橄榄核）。舌下神经（Ⅻ）根丝从前外侧沟出脑。</li></ul>
<ul><li>脑桥： 宽阔膨隆，正中为基底沟（容纳基底动脉）。基底部向两侧延伸为小脑中脚（脑桥臂）。三叉神经（Ⅴ）根丝位于基底部与小脑中脚交界处。延髓脑桥沟内，由内向外依次有展神经（Ⅵ）、面神经（Ⅶ）、前庭蜗神经（Ⅷ）根丝。</li></ul>
<ul><li>中脑： 一对粗大的大脑脚，脚间窝内有动眼神经（Ⅲ）根丝出脑</li></ul>
<p>。</p>
<ul><li>背侧面：</li></ul>
<ul><li>延髓： 下部有薄束结节和楔束结节（深面为薄束核与楔束核）。上部与小脑共同构成菱形窝（第四脑室底）下部。</li></ul>
<ul><li>脑桥： 构成菱形窝上部。</li></ul>
<ul><li>中脑： 两对隆起，上方为上丘（视觉反射中枢），下方为下丘（听觉反射中枢），合称四叠体。滑车神经（Ⅳ）在下丘下方出脑。</li></ul>
<ul><li>第四脑室： 位于延髓、脑桥与小脑之间，底为菱形窝。内有脉络丛产生脑脊液，向下通中央管，向上经中脑水管通第三脑室。</li></ul>
<p>2. 脑干内部结构</p>
<p>由灰质（神经核）、白质（纤维束）和网状结构构成。</p>
<ul><li>脑神经核： 与第Ⅲ-Ⅻ对脑神经相连，按功能分为4类：</li></ul>
<p>1. <strong>躯体运动核</strong> ： 支配头颈部骨骼肌。</p>
<ul><li>动眼神经核（Ⅲ）→ 大部分眼球外肌</li></ul>
<ul><li>滑车神经核（Ⅳ）→ 上斜肌</li></ul>
<ul><li>展神经核（Ⅵ）→ 外直肌</li></ul>
<ul><li>三叉神经运动核（Ⅴ）→ 咀嚼肌</li></ul>
<ul><li>面神经核（Ⅶ）→ 面肌</li></ul>
<ul><li>疑核（Ⅸ, Ⅹ, Ⅺ）→ 咽喉肌</li></ul>
<ul><li>舌下神经核（Ⅻ）→ 舌肌</li></ul>
<p>2. <strong>内脏运动核</strong> （ <strong>副交感核</strong> ）： 支配平滑肌、心肌和腺体。</p>
<ul><li>动眼神经副核（Ⅲ）→ 睫状肌、瞳孔括约肌</li></ul>
<ul><li>上泌涎核（Ⅶ）→ 泪腺、下颌下腺、舌下腺</li></ul>
<ul><li>下泌涎核（Ⅸ）→ 腮腺</li></ul>
<ul><li>迷走神经背核（Ⅹ）→ 颈、胸、腹腔脏器</li></ul>
<p>3. <strong>内脏感觉核</strong> ：</p>
<ul><li>孤束核（Ⅶ, Ⅸ, Ⅹ）→ 接受味觉及一般内脏感觉。</li></ul>
<p>4. <strong>躯体感觉核</strong> ：</p>
<ul><li>三叉神经感觉核（接受头面部痛温觉、触压觉等）→ 包括三叉神经中脑核、脑桥核、脊束核。</li></ul>
<ul><li>非脑神经核（重要中继核/核团）：</li></ul>
<ul><li>薄束核、楔束核： 位于延髓，接受薄束、楔束，传导意识性本体觉和精细触觉。</li></ul>
<ul><li>下橄榄核： 位于延髓橄榄深面，是大脑皮质、红核与小脑之间的中继站。</li></ul>
<ul><li>黑质： 位于中脑，含多巴胺能神经元，投射至纹状体。病变→帕金森病（静止性震颤）。</li></ul>
<ul><li>红核： 位于中脑，发出红核脊髓束，调节屈肌张力。</li></ul>
<ul><li>脑干纤维束（传导通路）：</li></ul>
<ul><li>锥体束： 大脑皮质→骨骼肌。分皮质核束（止于脑神经运动核）和皮质脊髓束（大部分在锥体交叉后下行）。</li></ul>
<ul><li>内侧丘系： 薄束核、楔束核→背侧丘脑，传导对侧躯干四肢本体觉和精细触觉。</li></ul>
<ul><li>脊髓丘系： 脊髓丘脑束的延续，传导对侧躯干四肢痛温觉和粗触觉。</li></ul>
<ul><li>三叉丘系： 三叉神经感觉核→背侧丘脑，传导对侧头面部痛温觉和触压觉。</li></ul>
<ul><li>脑干网状结构： 位于脑干中央，功能重要，是生命中枢（调节心跳、呼吸、血压等）。与觉醒、睡眠、镇痛有关。</li></ul>
<hr>
<p>（三）小脑</p>
<p>位置： 颅后窝，脑干背侧。</p>
<p>外形： 中间为小脑蚓，两侧为小脑半球。半球下面近枕骨大孔处有小脑扁桃体。</p>
<ul><li>临床联系： 颅内压增高时，小脑扁桃体可被挤入枕骨大孔，形成小脑扁桃体疝（枕骨大孔疝），压迫延髓危及生命。</li></ul>
<p>功能： 调节肌张力、维持身体平衡、协调随意运动。</p>
<p>损伤表现： 共济失调（走路不稳、指鼻不准）、意向性震颤、眼球震颤。</p>
<hr>
<p>（四）间脑</p>
<p>位于中脑与端脑之间，大部分被大脑半球掩盖。主要包括：</p>
<p>1. 背侧丘脑（丘脑）：</p>
<ul><li>一对卵圆形灰质团块，是感觉传导的（除嗅觉外）。</li></ul>
<ul><li>损伤可导致对侧半身感觉障碍、自发性疼痛等。</li></ul>
<p>2. 后丘脑：</p>
<ul><li>内侧膝状体 → 听觉传导中继站 → 听辐射 → 颞叶听觉中枢。</li></ul>
<ul><li>外侧膝状体 → 视觉传导中继站 → 视辐射 → 枕叶视觉中枢。</li></ul>
<ul><li>记忆口诀： “外视内听”。</li></ul>
<p>3. 下丘脑：</p>
<ul><li>位于丘脑前下方，构成第三脑室底。</li></ul>
<ul><li>主要结构：视交叉、灰结节、漏斗（连于垂体）、乳头体。</li></ul>
<ul><li>主要核团： 视上核（分泌抗利尿激素）、室旁核（分泌催产素）。</li></ul>
<ul><li>功能： 神经内分泌中心，调节体温、摄食、水平衡、昼夜节律及内脏活动。与垂体联系紧密（下丘脑-垂体束、垂体门脉系统）。</li></ul>
<hr>
<p>（五）端脑（大脑）</p>
<p>大脑半球表面为大脑皮质，深面为大脑髓质，髓质内埋有基底核，内部有侧脑室。</p>
<p>1. 大脑半球外形与分叶</p>
<ul><li>三条主要沟： 中央沟、外侧沟、顶枕沟。</li></ul>
<ul><li>五个叶： 额叶、顶叶、枕叶、颞叶、岛叶。</li></ul>
<p>2. 重要皮质功能区（Brodmann分区）</p>
<ul><li>躯体运动中枢： 中央前回、中央旁小叶前部（4、6区）。</li></ul>
<ul><li>特点：①对侧支配（除部分肌受双侧支配外）；②倒置人形投影（头面部正立）；③投射区大小与功能精细度正相关。</li></ul>
<ul><li>躯体感觉中枢： 中央后回、中央旁小叶后部（3、1、2区）。</li></ul>
<ul><li>特点：①接受对侧感觉；②倒置投影；③投射区大小与感觉灵敏度正相关。</li></ul>
<ul><li>视觉中枢： 距状沟上下皮质（17区）。接受同侧眼颞侧视网膜和对侧眼鼻侧视网膜的视觉冲动。</li></ul>
<ul><li>听觉中枢： 颞横回（41、42区）。接受双侧听觉冲动。</li></ul>
<ul><li>语言中枢（通常位于优势半球，多为左侧）：</li></ul>
<ul><li>运动性语言中枢（Broca区）： 额下回后部（44、45区）。损伤→运动性失语（能听懂，不会说）。</li></ul>
<ul><li>书写中枢： 额中回后部（6、8区）。损伤→失写症。</li></ul>
<ul><li>听觉性语言中枢（Wernicke区）： 颞上回后部（22区）。损伤→感觉性失语（能听到声音，不理解含义）。</li></ul>
<ul><li>视觉性语言中枢（阅读中枢）： 角回（39区）。损伤→失读症。</li></ul>
<ul><li>内脏活动中枢： 边缘叶。</li></ul>
<ul><li>嗅觉中枢： 海马旁回钩附近。</li></ul>
<p>3. 基底核</p>
<ul><li>位于大脑髓质深部的灰质团块。</li></ul>
<ul><li>组成：</li></ul>
<ul><li>纹状体： 尾状核 + 豆状核（壳 + 苍白球）。</li></ul>
<ul><li>新纹状体： 尾状核 + 壳（较新）。</li></ul>
<ul><li>旧纹状体： 苍白球（较古老）。</li></ul>
<ul><li>杏仁体： 与情绪、内脏活动有关，属边缘系统。</li></ul>
<ul><li>功能： 纹状体是锥体外系重要组成部分，调节躯体运动（非发起运动）。黑质-纹状体通路异常与帕金森病（多巴胺缺乏）、亨廷顿舞蹈症（不自主运动）相关。</li></ul>
<p>4. 大脑髓质（白质）纤维分类</p>
<p>1. 联络纤维： 联系同侧半球内各部皮质，如上纵束、下纵束、扣带等。</p>
<p>2. 连合纤维： 连接左右大脑半球，最主要的是胼胝体。</p>
<p>3. 投射纤维： 连接大脑皮质与皮质下结构的上、下行纤维束。绝大部分经过内囊。</p>
<p>5. 内囊</p>
<ul><li>位置： 位于尾状核、背侧丘脑与豆状核之间，水平切面呈“&gt;&lt;”形。</li></ul>
<ul><li>分部及主要纤维束：</li></ul>
<ul><li>前肢： 额桥束等。</li></ul>
<ul><li>膝部： 皮质核束（支配头面部骨骼肌）。</li></ul>
<ul><li>后肢： 皮质脊髓束（支配躯干四肢骨骼肌）、丘脑中央辐射（传导感觉）、视辐射、听辐射等。</li></ul>
<ul><li>临床联系： 内囊损伤（如脑出血） → “三偏症”：</li></ul>
<p>1. 对侧偏身感觉丧失（丘脑中央辐射受损）。</p>
<p>2. 对侧偏瘫（皮质脊髓束、皮质核束受损）。</p>
<p>3. 双眼对侧同向性偏盲（视辐射受损）。</p>
<p>6. 边缘系统</p>
<ul><li>组成： 边缘叶（扣带回、海马旁回、海马、齿状回等）+ 相关皮质及皮质下结构（杏仁体、下丘脑、丘脑前核等）。</li></ul>
<ul><li>功能： 与情绪、行为、内脏活动、学习记忆（海马尤其关键）及生殖等密切相关。</li></ul>
<ul><li>临床联系： 阿尔茨海默病 早期即出现海马萎缩，导致记忆进行性丧失。</li></ul>
<hr>
<p>（六）脑神经（12对）</p>
<p>1. 概述</p>
<ul><li>口诀（名称与顺序）： “一嗅二视三动眼，四滑五叉六外展，七面八听九舌咽，十迷十一副舌下全”。</li></ul>
<ul><li>口诀（连脑部位）： “一端脑、二间脑、三腹四背在中脑，五六七八在脑桥，最后四对延髓找”。</li></ul>
<ul><li>性质分类：</li></ul>
<ul><li>纯感觉： Ⅰ（嗅）、Ⅱ（视）、Ⅷ（前庭蜗/听）</li></ul>
<ul><li>纯运动： Ⅲ（动眼）、Ⅳ（滑车）、Ⅵ（展）、Ⅺ（副）、Ⅻ（舌下）</li></ul>
<ul><li>混合性： Ⅴ（三叉）、Ⅶ（面）、Ⅸ（舌咽）、Ⅹ（迷走）</li></ul>
<p>2. 各脑神经要点总结</p>
<p class="note-img"><img src="anatomy-images/img-30.jpg" loading="lazy" alt="解剖图 30"></p>
<h3>三、临床与记忆要点</h3>
<p>（一）神经系统疾病举例</p>
<ul><li>帕金森病：黑质病变 → 静止性震颤</li></ul>
<ul><li>亨廷顿舞蹈症：基底核病变 → 不自主舞蹈样动作</li></ul>
<ul><li>阿尔茨海默病：海马萎缩 → 记忆进行性丧失</li></ul>
<ul><li>脑中风（内囊损伤） → “三偏症”：</li></ul>
<p>1. 对侧偏瘫</p>
<p>2. 对侧偏身感觉丧失</p>
<p>3. 对侧同向性偏盲</p>
<p>（二）注射注意事项</p>
<ul><li>臀部注射部位：外上1/4象限，避免损伤坐骨神经</li></ul>
<p><strong>第一部分：传导通路</strong></p>
<p>传导通路是连接中枢与外周的高级通路，分为感觉（上行）传导通路和运动（下行）传导通路。</p>
<p>*一、感觉传导通路*</p>
<p>1. 躯干和四肢意识性本体感觉和精细触觉传导通路</p>
<ul><li>功能：传导位置觉、运动觉、振动觉和皮肤的精细触觉。</li></ul>
<ul><li>三级神经元路径：</li></ul>
<p>1. 第1级神经元：胞体在脊神经节，周围突分布于肌、腱、关节和皮肤；中枢突经后根入脊髓，在同侧后索上行形成薄束（T5及以下）和楔束（T4及以上）。</p>
<p>2. 第2级神经元：胞体在延髓的薄束核和楔束核，发出纤维在中线形成内侧丘系交叉，交叉后上行形成内侧丘系，止于背侧丘脑的腹后外侧核。</p>
<p>3. 第3级神经元：胞体在腹后外侧核，发出纤维经内囊后肢，投射到大脑皮质中央后回上2/3和中央旁小叶后部。</p>
<ul><li>损伤定位：</li></ul>
<ul><li>交叉以下损伤 → 同侧深感觉和精细触觉障碍。</li></ul>
<ul><li>交叉以上损伤 → 对侧深感觉和精细触觉障碍。</li></ul>
<p>2. 躯干和四肢非意识性本体感觉传导通路</p>
<ul><li>功能：传入小脑，反射性调节肌张力、协调运动、维持平衡。</li></ul>
<ul><li>二级神经元路径：</li></ul>
<p>1. 第1级神经元：胞体在脊神经节，中枢突进入脊髓，止于C8–L2胸核或腰骶膨大第Ⅴ–Ⅶ层外侧部。</p>
<p>2. 第2级神经元：胞体在上述核团，发出纤维组成脊髓小脑后束和脊髓小脑前束，分别经小脑下脚和上脚入小脑皮质。</p>
<p>3. 躯干和四肢痛温觉、粗触觉和压觉传导通路</p>
<ul><li>功能：传导浅感觉。</li></ul>
<ul><li>三级神经元路径：</li></ul>
<p>1. 第1级神经元：胞体在脊神经节。</p>
<p>2. 第2级神经元：胞体主要在脊髓后角，发出纤维经白质前连合交叉至对侧，形成脊髓丘脑侧束（痛温觉）和脊髓丘脑前束（粗触压觉），止于腹后外侧核。</p>
<p>3. 第3级神经元：胞体在腹后外侧核，发出纤维经内囊后肢，投射到中央后回上2/3。</p>
<ul><li>特点：在脊髓内交叉，交叉平面比感觉障碍平面高1–2个节段。</li></ul>
<ul><li>损伤：对侧损伤平面1–2个节段以下痛温觉障碍。</li></ul>
<p>4. 头面部浅感觉传导通路</p>
<ul><li>三级神经元路径：</li></ul>
<p>1. 第1级神经元：胞体在三叉神经节。</p>
<p>2. 第2级神经元：胞体在三叉神经脑桥核（触觉）和三叉神经脊束核（痛温觉），发出纤维交叉至对侧，组成三叉丘系，止于腹后内侧核。</p>
<p>3. 第3级神经元：胞体在腹后内侧核，发出纤维经内囊后肢，投射到中央后回下1/3。</p>
<ul><li>损伤定位：</li></ul>
<ul><li>三叉丘系及以上损伤 → 对侧头面部浅感觉障碍。</li></ul>
<ul><li>三叉丘系以下损伤 → 同侧头面部浅感觉障碍。</li></ul>
<p>5. 视觉传导通路及瞳孔对光反射</p>
<ul><li>视觉通路：</li></ul>
<p>1. 第1级神经元：视网膜双极细胞。</p>
<p>2. 第2级神经元：视网膜节细胞，轴突汇聚为视神经。</p>
<p>3. 视交叉：鼻侧纤维交叉，颞侧纤维不交叉，形成视束。</p>
<p>4. 第3级神经元：胞体在外侧膝状体，发出视辐射，经内囊后肢投射至枕叶距状沟皮质。</p>
<ul><li>视野缺损定位：</li></ul>
<ul><li>一侧视神经损伤 → 患侧眼全盲。</li></ul>
<ul><li>视交叉中部损伤 → 双眼颞侧视野偏盲。</li></ul>
<ul><li>一侧视束及以上损伤 → 双眼对侧同向性偏盲。</li></ul>
<ul><li>瞳孔对光反射：</li></ul>
<ul><li>通路：视网膜→视神经→视交叉→双侧视束→顶盖前区→双侧动眼神经副核→动眼神经→睫状神经节→瞳孔括约肌。</li></ul>
<ul><li>临床意义：</li></ul>
<ul><li>一侧视神经损伤：患眼直接对光反射消失，间接存在。</li></ul>
<ul><li>一侧动眼神经损伤：患眼直接和间接对光反射均消失。</li></ul>
<hr>
<p>*二、运动传导通路*</p>
<p>1. 锥体系</p>
<ul><li>上运动神经元：胞体在中央前回和中央旁小叶前部，轴突组成锥体束（皮质脊髓束 + 皮质核束）。</li></ul>
<ul><li>下运动神经元：胞体在脑神经运动核和脊髓前角，轴突直接支配骨骼肌。</li></ul>
<p>（1）皮质脊髓束</p>
<ul><li>路径：中央前回上2/3→内囊后肢→大脑脚→脑桥→延髓锥体。</li></ul>
<ul><li>锥体交叉：大部分交叉形成皮质脊髓侧束（支配四肢肌），小部分不交叉形成皮质脊髓前束（支配躯干肌）。</li></ul>
<ul><li>损伤：</li></ul>
<ul><li>交叉前损伤 → 对侧肢体瘫痪。</li></ul>
<ul><li>交叉后损伤 → 同侧肢体瘫痪。</li></ul>
<p>（2）皮质核束</p>
<ul><li>路径：中央前回下1/3→内囊膝部→脑干。</li></ul>
<ul><li>支配特点：</li></ul>
<ul><li>大部分核团受双侧支配。</li></ul>
<ul><li>仅面神经核下半和舌下神经核受对侧支配。</li></ul>
<ul><li>损伤表现：</li></ul>
<ul><li>核上瘫（上运动神经元）：对侧眼裂以下面肌瘫痪，舌偏向对侧，无肌萎缩。</li></ul>
<ul><li>核下瘫（下运动神经元）：同侧全部面肌或舌肌瘫痪，伴肌萎缩。</li></ul>
<p>上、下运动神经元损伤鉴别</p>
<p class="note-img"><img src="anatomy-images/img-31.jpg" loading="lazy" alt="解剖图 31"></p>
<p>2. 锥体外系</p>
<ul><li>组成：大脑皮质、纹状体、丘脑、红核、黑质、小脑、脑干网状结构等。</li></ul>
<ul><li>功能：调节肌张力、协调运动、维持姿势、完成习惯性动作。</li></ul>
<ul><li>损伤表现：运动失调、震颤麻痹、舞蹈症等。</li></ul>
<hr>
<h3>三、中枢神经系统损伤临床表现（补充）</h3>
<ul><li>大脑皮质运动区损伤 → 对侧单瘫。</li></ul>
<ul><li>一侧内囊损伤 → “三偏征”：</li></ul>
<p>1. 对侧肢体偏瘫 + 面舌瘫</p>
<p>2. 对侧偏身感觉障碍</p>
<p>3. 双眼对侧视野偏盲</p>
<ul><li>一侧大脑脚损伤 → 患侧动眼神经麻痹 + 对侧肢体偏瘫。</li></ul>
<ul><li>脊髓半横断损伤 → 同侧：</li></ul>
<p>1. 损伤平面以下中枢性瘫痪</p>
<p>2. 深感觉丧失</p>
<p>3. 对侧痛温觉丧失</p>
<p>4. 同侧节段性周围性瘫痪</p>
<hr>
<p><strong>第二部分：内脏神经系统</strong></p>
<p class="note-img"><img src="anatomy-images/img-32.jpg" loading="lazy" alt="解剖图 32"></p>
<p>*一、内脏运动神经*</p>
<p>交感神经 vs 副交感神经</p>
<p class="note-tbl">比较项 ｜ 交感神经 ｜ 副交感神经</p>
<p class="note-tbl">低级中枢 ｜ T1–L3侧角 ｜ 脑干内脏运动核 + S2–4骶副交感核</p>
<p class="note-tbl">神经节 ｜ 椎旁节、椎前节 ｜ 器官旁节、器官内节</p>
<p class="note-tbl">节前/后纤维 ｜ 节前短、节后长 ｜ 节前长、节后短</p>
<p class="note-tbl">分布范围 ｜ 广泛（血管、汗腺、立毛肌等） ｜ 局限（多数血管、汗腺无支配）</p>
<p class="note-tbl">功能 ｜ 应激反应 ｜ 静息反应</p>
<p>交感神经纤维去向</p>
<p class="note-img"><img src="anatomy-images/img-33.jpg" loading="lazy" alt="解剖图 33"></p>
<p class="note-img"><img src="anatomy-images/img-34.jpg" loading="lazy" alt="解剖图 34"></p>
<p class="note-img"><img src="anatomy-images/img-35.jpg" loading="lazy" alt="解剖图 35"></p>
<p>副交感神经颅部走行</p>
<ul><li>动眼神经副核 → 睫状神经节 → 瞳孔括约肌、睫状肌</li></ul>
<ul><li>上泌涎核 → 翼腭神经节 → 泪腺、鼻腔腺体</li></ul>
<ul><li>上泌涎核 → 下颌下神经节 → 下颌下腺、舌下腺</li></ul>
<ul><li>下泌涎核 → 耳神经节 → 腮腺</li></ul>
<ul><li>迷走神经背核 → 胸腹腔脏器节 → 支配至结肠左曲</li></ul>
<p class="note-img"><img src="anatomy-images/img-36.jpg" loading="lazy" alt="解剖图 36"></p>
<p>交通支</p>
<ul><li>白交通支：节前纤维进入交感干，仅存在于T1–L3。</li></ul>
<ul><li>灰交通支：节后纤维返回脊神经，存在于全部节段。</li></ul>
<p class="note-img"><img src="anatomy-images/img-37.jpg" loading="lazy" alt="解剖图 37"></p>
<hr>
<p>*二、内脏感觉神经*</p>
<ul><li>特点：</li></ul>
<p>1. 痛阈高，对牵拉、膨胀、缺血敏感。</p>
<p>2. 定位模糊。</p>
<p>3. 牵涉痛：内脏疾病引起体表特定区域疼痛（如心绞痛→左胸、左臂内侧）。</p>
<hr>
<p><strong>第三部分：脑和脊髓的被膜、脑室、脑脊液、血管和脑屏障</strong></p>
<p>*一、被膜*</p>
<p class="note-img"><img src="anatomy-images/img-38.jpg" loading="lazy" alt="解剖图 38"></p>
<p>1. 硬膜</p>
<ul><li>硬脊膜：与椎管骨膜间为硬膜外隙（麻醉部位）。</li></ul>
<ul><li>硬脑膜：</li></ul>
<ul><li>形成大脑镰、小脑幕（幕切迹疝可压迫动眼神经和中脑）。</li></ul>
<ul><li>硬脑膜窦：含静脉血，无平滑肌，不易止血。包括：</li></ul>
<ul><li>上矢状窦、直窦、横窦、乙状窦、海绵窦（与面部静脉相通，感染可波及）。</li></ul>
<p class="note-img"><img src="anatomy-images/img-39.jpg" loading="lazy" alt="解剖图 39"></p>
<p>2. 蛛网膜</p>
<ul><li>与软膜之间为蛛网膜下隙，内含脑脊液。</li></ul>
<ul><li>扩大处称池（小脑延髓池、终池）。</li></ul>
<ul><li>蛛网膜粒：脑脊液回流入血部位。</li></ul>
<p>3. 软膜</p>
<ul><li>薄而富含血管，形成脉络丛，产生脑脊液。</li></ul>
<hr>
<p>*二、脑室与脑脊液循环*</p>
<h3>一、脑室</h3>
<p>脑室是脑内的腔隙，包括左右侧脑室、第三脑室和第四脑室</p>
<p>。脑室壁内衬以室管膜上皮，脑室腔内充满</p>
<p>脑脊液，每个脑室内均有脉络丛。</p>
<p>（一）侧脑室</p>
<p>侧脑室 <strong>lateral ventricle</strong> 左右各一，分别位于左、右大脑半球内。</p>
<p>侧脑室分为四部分：①中央部 <strong>central part</strong> ：位于顶叶内；②前角</p>
<p><strong>anterior horn</strong> ：伸入额叶内；③后角 <strong>posterior horn</strong> ：伸入枕叶内；</p>
<p>④下角 <strong>inferior horn</strong> ：伸入颞叶内。左、右侧脑室各自经左、右室间</p>
<p>孔与第三脑室相通。</p>
<p>（二）第三脑室</p>
<p>第三脑室 <strong>third ventricle</strong> 为位于两侧背侧丘脑和下丘脑之间呈矢状</p>
<p>位的裂隙，向上外方经室间孔与侧脑室相通，向后下方借中脑水管与</p>
<p>第四脑室相通。</p>
<p>（三）第四脑室</p>
<p>第四脑室 <strong>fourth ventricle</strong> 位于延髓、脑桥与小脑之间。其底即菱</p>
<p>形窝，其顶形如帐篷，朝向小脑。在第四脑室顶下部，菱形窝下角正</p>
<p>上 方 有 一 孔 ， 称 为 第 四 脑 室 正 中 孔 <strong>median aperture of fourth</strong></p>
<p><strong>ventricle</strong> ，靠近菱形窝两个侧角处各有一孔，称为第四脑室外侧孔</p>
<p><strong>lateral aperture of fourth ventricle</strong> ，它们皆与蛛网膜下隙相通。第</p>
<p>四脑室向上通中脑水管，向下通脊髓中央管。</p>
<p>脑脊液</p>
<p class="note-img"><img src="anatomy-images/img-40.jpg" loading="lazy" alt="解剖图 40"></p>
<ul><li>功能：缓冲、保护、运输代谢产物、维持颅内压。</li></ul>
<ul><li>阻塞后果：脑积水。</li></ul>
<hr>
<p>*三、脑的动脉*</p>
<p>1. 颈内动脉系统</p>
<ul><li>供应大脑半球前2/3。</li></ul>
<ul><li>分支：</li></ul>
<ul><li>大脑前动脉</li></ul>
<p><strong>· 大脑中动脉（豆纹动脉易出血 → “三偏征”）</strong></p>
<ul><li>后交通动脉</li></ul>
<p>2. 椎-基底动脉系统</p>
<ul><li>供应大脑半球后1/3、脑干、小脑。</li></ul>
<ul><li>终支：大脑后动脉。</li></ul>
<p><strong>3. 大脑动脉环</strong></p>
<ul><li>由前交通动脉、两侧大脑前动脉、颈内动脉末端、后交通动脉、大脑后动脉组成。</li></ul>
<ul><li>位于脑底，起侧支循环作用。</li></ul>
<hr>
<p>*四、脑屏障*</p>
<p>1. 血-脑屏障：毛细血管内皮（紧密连接）、基膜、星形胶质细胞终足。</p>
<p>2. 血-脑脊液屏障：位于脉络丛。</p>
<p>3. 脑脊液-脑屏障：结构不完善，通透性较高。</p>
